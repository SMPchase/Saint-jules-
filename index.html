<script type="module">
const tracks=[{num:"00",title:"Boy Genius Interlude",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/00%20Boy%20Genius%20Interlude%20Lude%20Only.mp3",interlude:true},{num:"01",title:"Boy Genius",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/01%20Boy%20Genius.wav"},{num:"02",title:"Jump!!!",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/02%20Jump%21%21%21.wav"},{num:"03",title:"Come to Life",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/03%20Come%20to%20Life.wav"},{num:"04",title:"The Proposition",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/04%20The%20Proposition.wav"},{num:"05",title:"Rude",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/05%20Rude.wav"},{num:"06",title:"PISA",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/06%20PISA.wav"},{num:"07",title:"Apple Pie",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/07%20Apple%20Pie.wav"},{num:"08",title:"I Know",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/08%20I%20Know..wav"},{num:"09",title:"Felt It? My Darling",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/09%20Felt%20It%3F%3AMy%20Darling%20.wav"},{num:"10",title:"Crash Dummy",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/10%20Crash%20Dummy.wav"},{num:"11",title:"Mr. Please",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/11%20Mr.Please.wav"},{num:"12",title:"WHO KNEW",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/12%20WHO%20KNEW.wav"},{num:"13",title:"Sky Is Falling",src:"Lord%20Have%20Mercy%2C%20He%27s%20A%20Crash%20Dummy%21/13%20Sky%20Is%20Falling.wav"}];
const $=s=>document.querySelector(s),audio=$("#audio"),trackList=$("#trackList"),nowNum=$("#nowNum"),nowTitle=$("#nowTitle"),playPause=$("#playPause"),seek=$("#seek"),currentTime=$("#currentTime"),duration=$("#duration");
const songIndexes=tracks.map((t,i)=>t.interlude?null:i).filter(Number.isInteger);let state={mode:"songs",current:songIndexes[0],queue:[]};
function fmt(s){if(!Number.isFinite(s))return"0:00";return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`}
function visible(){return state.mode==="album"?tracks.map((_,i)=>i):songIndexes}
function render(){trackList.innerHTML=visible().map(i=>`<button class="track ${i===state.current?"active":""} ${tracks[i].interlude?"interlude":""}" data-i="${i}" type="button"><span class="num">${tracks[i].num}</span><span class="title">${tracks[i].title}</span></button>`).join("");trackList.querySelectorAll(".track").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);state.queue=[];setTrack(i,true,tracks[i].interlude?"album":"songs")})}
function setTrack(i,autoplay=false,mode=state.mode){state.mode=mode;let n=((i%tracks.length)+tracks.length)%tracks.length;if(state.mode!=="album"&&tracks[n].interlude)n=songIndexes[0];state.current=n;audio.src=tracks[n].src;nowNum.textContent=tracks[n].num;nowTitle.textContent=tracks[n].title;render();if(autoplay)play()}
async function play(){try{await audio.play();update()}catch{playPause.textContent="▶"}}function pause(){audio.pause();update()}function update(){playPause.textContent=audio.paused?"▶":"Ⅱ"}
function nextSong(){const slot=songIndexes.indexOf(state.current);return songIndexes[(slot+1+songIndexes.length)%songIndexes.length]}
function next(){if(state.queue.length){setTrack(state.queue.shift(),true,"songs");return}state.mode==="album"?setTrack(state.current+1,true,"album"):setTrack(nextSong(),true,"songs")}
$("#orderBtn").onclick=()=>{state.queue=[];setTrack(0,true,"album")};$("#shuffleBtn").onclick=()=>{state.mode="songs";const pool=songIndexes.filter(i=>i!==state.current);const first=pool[Math.floor(Math.random()*pool.length)]||songIndexes[0];state.queue=[...songIndexes].filter(i=>i!==first).sort(()=>Math.random()-.5);setTrack(first,true,"songs")};playPause.onclick=()=>audio.paused?play():pause();

</script>
