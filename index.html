<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#fffdf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saint Jules" />
  <meta name="description" content="Saint Jules — Lord Have Mercy, He's A Crash Dummy!" />
  <meta property="og:title" content="Saint Jules" />
  <meta property="og:image" content="album-cover.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Saint Jules</title>
  <style>
    :root {
      --pink-0:#fff4f8;
      --pink-1:#f8d3df;
      --pink-2:#f1a9c1;
      --pink-3:#ed5f97;
      --red:#ff315e;
      --cream:#f4dfbd;
      --sky:#a9d9e8;
      --ink:#21181c;
      --muted:rgba(33,24,28,.56);
      --glass:rgba(255,255,255,.36);
      --line:rgba(255,255,255,.72);
      --shadow:0 22px 70px rgba(85,35,56,.22);
      --ease:cubic-bezier(.2,.82,.2,1);
      --card-x:0px;
      color-scheme:light;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#efb7ca}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
      overscroll-behavior:none;
    }
    button,a,input{font:inherit;color:inherit}
    button{cursor:pointer}
    a{text-decoration:none}
    img{display:block;max-width:100%}

    .world{
      position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%,rgba(255,49,94,.34),transparent 31%),
        radial-gradient(circle at 84% 20%,rgba(169,217,232,.62),transparent 34%),
        radial-gradient(circle at 56% 92%,rgba(244,223,189,.78),transparent 42%),
        linear-gradient(145deg,#f5aec5 0%,#f3c3d2 44%,#dbeef1 100%);
    }
    .world::before{
      content:"";position:absolute;inset:-14%;
      background:url("album-cover.jpeg") center/cover no-repeat;
      filter:blur(72px) saturate(1.15);opacity:.31;transform:scale(1.2);
    }
    .world::after{
      content:"";position:absolute;inset:0;opacity:.48;
      background:
        radial-gradient(circle,rgba(255,255,255,.46) 0 1.2px,transparent 1.8px) 0 0/32px 32px,
        radial-gradient(circle,rgba(255,255,255,.22) 0 1px,transparent 1.5px) 16px 13px/41px 41px,
        linear-gradient(180deg,rgba(255,255,255,.14),transparent 42%,rgba(255,255,255,.18));
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.15) 62%,transparent);
      -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.15) 62%,transparent);
    }

    .shine{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .shine::before{
      content:"";position:absolute;top:-20vh;left:-55vw;width:34vw;height:150vh;
      background:linear-gradient(100deg,transparent,rgba(255,255,255,.76),transparent);
      filter:blur(18px);transform:rotate(18deg);opacity:0;animation:glint 12s var(--ease) infinite;
    }
    @keyframes glint{
      0%,75%{opacity:0;translate:-25vw 0}
      80%{opacity:.55}
      92%,100%{opacity:0;translate:190vw 0}
    }

    .app{
      position:relative;z-index:2;width:100%;min-height:100vh;min-height:100dvh;
      display:grid;grid-template-rows:auto 1fr;
      padding:max(12px,env(safe-area-inset-top)) clamp(14px,3vw,34px) max(12px,env(safe-area-inset-bottom));
    }

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
    .brand,.menu-button,.play-with-me,.glass{
      border:1px solid var(--line);background:rgba(255,255,255,.31);
      -webkit-backdrop-filter:blur(20px) saturate(1.12);backdrop-filter:blur(20px) saturate(1.12);
      box-shadow:inset 0 1px rgba(255,255,255,.78),0 10px 30px rgba(75,30,48,.12);
    }
    .brand{height:44px;padding:0 19px;display:inline-flex;align-items:center;border-radius:999px;font-size:11px;font-weight:950;letter-spacing:.31em;text-transform:uppercase}
    .top-actions{display:flex;align-items:center;gap:9px}
    .play-with-me{
      min-height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
      color:#fff;background:linear-gradient(135deg,#ff4f87,#d92c67 58%,#8d1847);font-size:10px;font-weight:950;
      letter-spacing:.15em;text-transform:uppercase;box-shadow:inset 0 1px rgba(255,255,255,.56),0 12px 28px rgba(198,34,91,.26);
      transition:transform .2s var(--ease),box-shadow .2s var(--ease);
    }
    .install-button{
      min-height:38px;border:2px outset #ece9e0;border-radius:1px;background:#f3f1ea;
      font-family:"Courier New",monospace;font-size:9px;color:#111;
    }
    .install-button:focus-visible{outline:2px solid #d84c7f;outline-offset:2px}
    .play-with-me:hover{transform:translateY(-2px);box-shadow:inset 0 1px rgba(255,255,255,.56),0 16px 34px rgba(198,34,91,.32)}
    .play-with-me:focus-visible,.brand:focus-visible,.menu-button:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:3px}
    .menu-button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:950;letter-spacing:.05em}

    .layout{
      width:min(1220px,100%);margin:auto;display:grid;grid-template-columns:minmax(420px,1fr) minmax(320px,420px);
      gap:clamp(28px,6vw,86px);align-items:center;padding:18px 0 28px;
    }

    .machine{display:grid;place-items:center;min-width:0}
    .cabinet{width:min(610px,100%);display:grid;gap:16px;justify-items:center}

    .reel-shell{
      width:min(100%,560px);position:relative;padding:8px 0;overflow:hidden;
      border:1px solid rgba(255,255,255,.66);border-radius:999px;background:rgba(255,255,255,.22);
      box-shadow:inset 0 1px rgba(255,255,255,.72),0 14px 42px rgba(82,34,52,.13);
    }
    .reel-shell::before,.reel-shell::after{
      content:"";position:absolute;top:0;bottom:0;width:72px;z-index:3;pointer-events:none
    }
    .reel-shell::before{left:0;background:linear-gradient(90deg,rgba(242,187,205,.96),transparent)}
    .reel-shell::after{right:0;background:linear-gradient(-90deg,rgba(224,231,232,.94),transparent)}
    .reel{
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;
      padding:0 calc(50% - 28px);touch-action:pan-x;overscroll-behavior-x:contain;
    }
    .reel::-webkit-scrollbar{display:none}
    .chip{
      flex:0 0 56px;height:56px;scroll-snap-align:center;border:1px solid rgba(255,255,255,.76);border-radius:50%;
      display:grid;place-items:center;background:rgba(255,255,255,.46);box-shadow:inset 0 1px rgba(255,255,255,.84),0 8px 20px rgba(76,30,47,.12);
      font-size:12px;font-weight:950;transition:transform .22s var(--ease),background .22s var(--ease),color .22s var(--ease);
    }
    .chip[aria-current="true"]{
      transform:scale(1.08);color:#fff;background:linear-gradient(145deg,#ff5f91,#ef376f 58%,#c72051);
      box-shadow:inset 0 1px rgba(255,255,255,.55),0 10px 28px rgba(224,51,105,.28);
    }

    .card-stage{position:relative;width:min(86vw,520px);display:grid;place-items:center;padding:12px}
    .card-glow{position:absolute;inset:8%;border-radius:42px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.62),transparent 32%),linear-gradient(135deg,rgba(255,69,128,.46),rgba(169,217,232,.43),rgba(244,223,189,.50));filter:blur(34px);opacity:.88}
    .album-card{
      position:relative;width:100%;aspect-ratio:1;z-index:2;border-radius:36px;
      transform:translateX(var(--card-x));
      transition:transform .32s var(--ease),filter .25s var(--ease);filter:drop-shadow(0 30px 54px rgba(65,28,43,.24));touch-action:none;
    }
    .album-card.dragging{transition:none}
    .cover{
      position:absolute;inset:0;border-radius:inherit;overflow:hidden;border:1px solid rgba(255,255,255,.88);
      background:rgba(255,255,255,.3);box-shadow:inset 0 1px rgba(255,255,255,.9),0 0 0 8px rgba(255,255,255,.12),var(--shadow);
    }
    .cover::before{
      content:"";position:absolute;inset:-5px;z-index:4;pointer-events:none;border-radius:inherit;
      background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.9) 0 1.4deg,transparent 1.4deg 6deg);
      -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);opacity:.55;
    }
    .cover::after{
      content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
      background:linear-gradient(118deg,transparent 0 40%,rgba(255,255,255,.46) 47%,transparent 55% 100%);
      translate:-62% 0;animation:cardShine 9s var(--ease) infinite;
    }
    @keyframes cardShine{0%,68%{translate:-62% 0;opacity:0}74%{opacity:.65}90%,100%{translate:62% 0;opacity:0}}
    .cover img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}

    .cover-play{
      position:absolute;inset:0;z-index:5;border:0;background:transparent;display:grid;place-items:center;
      touch-action:none;
    }
    .play-disc{
      width:82px;height:82px;border:1px solid rgba(255,255,255,.83);border-radius:50%;display:grid;place-items:center;
      color:#fff;background:rgba(33,20,26,.22);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
      box-shadow:inset 0 1px rgba(255,255,255,.72),0 14px 38px rgba(35,15,23,.24);
      font-size:27px;font-weight:950;transition:transform .2s var(--ease),background .2s var(--ease),opacity .2s var(--ease);
      text-shadow:0 3px 18px rgba(0,0,0,.25);
    }
    .album-card.playing .play-disc{opacity:.7;transform:scale(.9);background:rgba(33,20,26,.15)}
    .cover-play:active .play-disc{transform:scale(.94)}

    .now-card{
      width:min(100%,560px);padding:16px 20px;border-radius:26px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
      border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(20px) saturate(1.12);backdrop-filter:blur(20px) saturate(1.12);
      box-shadow:inset 0 1px rgba(255,255,255,.8),0 16px 42px rgba(77,31,49,.13);
    }
    .now-num{min-width:55px;color:var(--muted);font-size:12px;font-weight:950;letter-spacing:.16em}
    .now-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(28px,4vw,44px);line-height:.95;letter-spacing:-.055em;font-weight:950}

    .side{display:grid;gap:12px;align-content:center}
    .mode-row,.transport,.progress,.desktop-list{
      border:1px solid rgba(255,255,255,.68);background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(20px) saturate(1.12);backdrop-filter:blur(20px) saturate(1.12);
      box-shadow:inset 0 1px rgba(255,255,255,.76),0 14px 38px rgba(75,30,48,.13)
    }
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px;border-radius:999px}
    .mode-button{height:48px;border:0;border-radius:999px;background:transparent;font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;transition:background .22s var(--ease),transform .22s var(--ease)}
    .mode-button.active{background:linear-gradient(180deg,#fff,#ffd8e4 58%,#f3a6be);box-shadow:0 8px 22px rgba(235,75,129,.17)}
    .mode-button:active{transform:scale(.97)}
    .dice-icon{display:inline-block;margin-right:7px;font-size:18px;vertical-align:-2px;transform-origin:center}
    .mode-button.rolling .dice-icon{animation:diceRoll .65s ease}
    @keyframes diceRoll{0%{transform:rotate(0) scale(1)}35%{transform:rotate(170deg) scale(1.22)}70%{transform:rotate(300deg) scale(.92)}100%{transform:rotate(360deg) scale(1)}}

    .transport{padding:11px;border-radius:30px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
    .transport button{border:0;background:transparent;height:54px;display:grid;place-items:center;font-size:26px;font-weight:950}
    .transport .main-play{width:74px;height:74px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:linear-gradient(180deg,#fff,#ffd9e5 64%,#f5a8c0);box-shadow:0 14px 34px rgba(221,66,118,.18);font-size:25px}

    .progress{padding:10px 13px;border-radius:999px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;color:var(--muted);font-size:11px;font-weight:850}
    .progress input{width:100%;accent-color:var(--pink-3)}

    .desktop-list{max-height:410px;overflow:auto;border-radius:28px;padding:8px;scrollbar-width:none}
    .desktop-list::-webkit-scrollbar{display:none}
    .track-group{display:grid;gap:3px}
    .track-group+.track-group{margin-top:8px}
    .track-group-title{padding:7px 10px 4px;color:var(--muted);font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
    .track-row{width:100%;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px;border:0;border-radius:18px;background:transparent;text-align:left}
    .track-row.active{background:rgba(255,255,255,.42)}
    .track-row span:first-child{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.42);font-size:11px;font-weight:950}
    .track-row span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850}

    .mobile-actions{display:none}
    .sheet-scrim{position:fixed;inset:0;z-index:20;background:rgba(44,20,30,.16);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .24s var(--ease)}
    .sheet-scrim.open{opacity:1;pointer-events:auto}
    .sheet{
      position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:21;
      height:min(72vh,640px);height:min(72dvh,640px);max-height:calc(100dvh - max(28px,env(safe-area-inset-top)) - max(24px,env(safe-area-inset-bottom)));
      padding:10px;border:1px solid rgba(255,255,255,.74);border-radius:30px;background:rgba(248,224,233,.88);-webkit-backdrop-filter:blur(28px) saturate(1.15);backdrop-filter:blur(28px) saturate(1.15);
      box-shadow:0 28px 90px rgba(63,27,41,.28);overflow:hidden;opacity:0;pointer-events:none;transform:translateY(calc(100% + 24px));transition:transform .32s var(--ease),opacity .22s var(--ease);
      display:grid;grid-template-rows:auto minmax(0,1fr)
    }
    .sheet.open{opacity:1;pointer-events:auto;transform:translateY(0)}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:6px 8px 10px 12px;font-weight:950;border-bottom:1px solid rgba(255,255,255,.5)}
    .sheet-close{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:rgba(255,255,255,.58);font-size:22px;line-height:1}
    .sheet-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 4px 10px;scrollbar-width:none}
    .sheet-body::-webkit-scrollbar{display:none}
    .sheet .track-row{min-height:58px;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:9px 10px;margin:0 0 6px;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.22);border-radius:18px}
    .sheet .track-row.active{background:rgba(255,255,255,.62);box-shadow:0 8px 22px rgba(84,36,55,.09)}
    .sheet .track-row span:first-child{width:38px;height:38px}
    .sheet .track-row span:last-child{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.14;font-size:15px;overflow-wrap:anywhere}
    .links-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px}
    .brand-link{min-height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 24px rgba(40,20,28,.12)}
    .apple-link{background:linear-gradient(135deg,#ff5d9d,#a974ff 62%,#5dd7ff)}
    .spotify-link{background:#1ed760;color:#07130b}
    .youtube-link{background:#ff0033}
    .instagram-link{background:radial-gradient(circle at 30% 115%,#feda75,#fa7e1e 28%,#d62976 54%,#962fbf 74%,#4f5bd5)}
    .community-link{background:linear-gradient(135deg,#171015,#ff3f7d 58%,#28d7ee);grid-column:1/-1}
    .minecraft-link{background:linear-gradient(135deg,#4f8a3f,#255d33 62%,#153c2c)}
    .unset{opacity:.7}

    .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:50;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px);padding:11px 14px;border:1px solid rgba(255,255,255,.76);border-radius:999px;background:rgba(255,255,255,.65);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 38px rgba(68,28,45,.18);font-size:12px;font-weight:900;transition:opacity .22s var(--ease),transform .22s var(--ease)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:760px){
      html,body{height:100%;overflow:hidden}
      .world::before{filter:blur(42px) saturate(1.1);opacity:.27}
      .shine::before{width:52vw}
      .app{height:100vh;height:100dvh;min-height:0;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));grid-template-rows:48px minmax(0,1fr)}
      .brand{height:40px;padding:0 16px;font-size:10px;letter-spacing:.28em}
      .top-actions{gap:6px}
      .play-with-me{min-height:40px;padding:0 13px;font-size:9px;letter-spacing:.11em}
      .menu-button{width:40px;height:40px}
      .layout{height:100%;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:7px;padding:4px 0 0}
      .machine{min-height:0;overflow:hidden;align-content:center}
      .cabinet{height:100%;min-height:0;gap:7px;align-content:center}
      .reel-shell{width:min(100%,420px);padding:5px 0}
      .reel{gap:6px;padding-inline:calc(50% - 23px)}
      .chip{flex-basis:46px;height:46px;font-size:10px}
      .card-stage{width:min(72vw,310px);padding:4px}
      .card-glow{filter:blur(24px)}
      .album-card{border-radius:27px}
      .cover{box-shadow:inset 0 1px rgba(255,255,255,.9),0 0 0 5px rgba(255,255,255,.12),0 20px 50px rgba(65,28,43,.22)}
      .play-disc{width:66px;height:66px;font-size:23px}
      .now-card{width:min(100%,420px);min-height:54px;padding:8px 12px;border-radius:20px;gap:10px}
      .now-num{min-width:47px;font-size:10px}
      .now-title{font-size:clamp(22px,6.5vw,29px)}
      .side{gap:6px;align-content:end}
      .desktop-list{display:none}
      .mode-row{padding:5px;gap:5px}
      .mode-button{height:38px;font-size:10px;letter-spacing:.1em}
      .dice-icon{font-size:15px;margin-right:5px}
      .transport{padding:6px 10px;border-radius:22px;gap:10px}
      .transport button{height:42px;font-size:22px}
      .transport .main-play{width:55px;height:55px;font-size:20px}
      .progress{padding:6px 10px;font-size:9px;min-height:32px}
      .mobile-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .mobile-actions button{height:36px;border:1px solid rgba(255,255,255,.68);border-radius:999px;background:rgba(255,255,255,.28);font-size:10px;font-weight:950;letter-spacing:.1em;text-transform:uppercase}
      .sheet{left:8px;right:8px;height:min(78vh,680px);height:min(78dvh,680px);border-radius:26px;padding:8px}
      .sheet-head{min-height:52px}
      .sheet .track-row{min-height:60px}
    }

    @media(max-width:390px),(max-height:700px){
      .app{grid-template-rows:42px minmax(0,1fr);padding-top:max(7px,env(safe-area-inset-top));gap:4px}
      .topbar{min-height:42px}
      .brand{height:36px;font-size:9px}
      .play-with-me{min-height:36px;padding:0 10px;font-size:8px}
      .menu-button{width:36px;height:36px}
      .cabinet{gap:5px}
      .reel-shell{padding:4px 0}
      .chip{flex-basis:42px;height:42px}
      .reel{padding-inline:calc(50% - 21px)}
      .card-stage{width:min(62vw,260px)}
      .play-disc{width:58px;height:58px;font-size:20px}
      .now-card{min-height:47px;padding:6px 10px}
      .now-title{font-size:20px}
      .mode-button{height:34px;font-size:9px}
      .transport{padding:4px 8px}
      .transport button{height:37px}
      .transport .main-play{width:48px;height:48px}
      .progress{min-height:28px;padding:4px 8px}
      .mobile-actions button{height:32px;font-size:9px}
    }

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    /* Shared Saint Jules 2000s system: white paper, pink controls, gold details. */
    :root{
      --pink-0:#fff7fb;
      --pink-1:#f9e5ec;
      --pink-2:#eab3c7;
      --pink-3:#d84c7f;
      --cream:#f5edcf;
      --ink:#171717;
      --muted:#6d6a64;
      --glass:#fff;
      --line:#292929;
      --shadow:none;
    }
    html,body{background:#fffdf8}
    body{font-family:Tahoma,Verdana,Arial,sans-serif;overscroll-behavior:auto}
    .world{
      background:
        linear-gradient(rgba(183,144,47,.08) 1px,transparent 1px) 0 0/18px 18px,
        linear-gradient(90deg,rgba(216,76,127,.055) 1px,transparent 1px) 0 0/18px 18px,
        #fffdf8;
    }
    .world::before,.shine{display:none}
    .world::after{opacity:0;background:transparent}
    .app{
      width:min(1160px,100%);
      margin:0 auto;
      padding:max(12px,env(safe-area-inset-top)) clamp(12px,2vw,24px) max(12px,env(safe-area-inset-bottom));
      border-inline:1px solid #d5d2c8;
      background:rgba(255,255,255,.96);
    }
    .topbar{min-height:52px;padding-bottom:10px;border-bottom:1px solid #202020}
    .brand,.menu-button,.play-with-me,.glass,.reel-shell,.now-card,.mode-row,.transport,.progress,.desktop-list{
      -webkit-backdrop-filter:none;
      backdrop-filter:none;
      box-shadow:none;
    }
    .brand{
      height:38px;
      padding:0 10px;
      border:1px solid #202020;
      border-radius:1px;
      background:#fff;
      font-family:"Courier New",monospace;

    .play-with-me{
      min-height:38px;
      padding:0 13px;
      border:2px outset #f4b0c9;
      border-radius:1px;
      background:#d84c7f;
      color:#111;
      font-size:9px;
      letter-spacing:.1em;
      box-shadow:none;
    }
    .play-with-me:hover{transform:none;background:#ed78a3;box-shadow:none}
    .menu-button{
      width:38px;height:38px;border:2px outset #ece9e0;border-radius:1px;background:#f3f1ea;
    }
    .play-with-me:focus-visible,.brand:focus-visible,.menu-button:focus-visible{outline:2px solid #d84c7f;outline-offset:2px}
    .layout{
      width:100%;
      grid-template-columns:minmax(380px,1fr) minmax(290px,380px);
      gap:clamp(18px,4vw,50px);
      padding:22px 0 8px;
    }
    .cabinet{gap:10px}
    .reel-shell{

    .desktop-list{max-height:380px;padding:4px}
    .track-group+.track-group{margin-top:6px;border-top:1px solid #c7c4ba}
    .track-group-title{padding:7px 7px 4px;color:#6d6a64;font-family:"Courier New",monospace;font-size:9px;letter-spacing:.1em}
    .track-row{grid-template-columns:34px minmax(0,1fr);padding:7px;border:1px solid transparent;border-radius:1px}
    .track-row:hover{border-color:#b7902f;background:#fffdf2}

    .sheet-head{border-bottom:1px solid #202020;background:#f5edcf;font-family:"Courier New",monospace;font-size:12px}
    .sheet-close{border:2px outset #ece9e0;border-radius:1px;background:#f3f1ea}
    .sheet .track-row{border:1px solid #c7c4ba;border-radius:1px;background:#fff}
    .sheet .track-row.active{border-color:#d84c7f;background:#f9e5ec;box-shadow:none}
    .links-grid{gap:5px}
    .brand-link{min-height:48px;border:1px solid #202020;border-radius:1px;box-shadow:none}
    .apple-link,.instagram-link{background:#d84c7f}
    .spotify-link{background:#f5edcf;color:#111}
    .youtube-link{background:#fff;color:#a71950}
    .community-link{background:#fff;color:#111}
    .minecraft-link{background:#b7902f;color:#111}
    .toast{border:1px solid #202020;border-radius:1px;background:#f5edcf;box-shadow:4px 4px 0 rgba(0,0,0,.14);-webkit-backdrop-filter:none;backdrop-filter:none}

    @media(max-width:760px){
      html,body{background:#fffdf8}
      .app{border:0;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));grid-template-rows:44px minmax(0,1fr)}

      .transport button{height:34px}
      .transport .main-play{width:48px;height:38px}
      .progress{min-height:28px;padding:4px 7px}
      .mobile-actions button{height:30px}
      .sheet{left:6px;right:6px;padding:6px}
    }
  </style>
</head>
<body>
  <div class="world" aria-hidden="true"></div>

                <button class="cover-play" id="coverPlay" type="button" aria-label="Play">
                  <span class="play-disc" id="coverGlyph">▶</span>
                </button>
              </div>
            </div>
          </div>

          <div class="now-card" aria-live="polite">
            <span class="now-num" id="nowNum">01 / 13</span>

      <aside class="side">

        <div class="transport" aria-label="Playback controls">

          <button class="main-play" id="mainPlay" type="button" aria-label="Play">▶</button>

        <div class="progress">

  </main>

  <section class="sheet" id="tracksSheet" aria-label="Tracks">
    <div class="sheet-head"><span>Tracks</span><button class="sheet-close" data-close-sheet type="button" aria-label="Close">×</button></div>
    <div class="sheet-body" id="mobileList"></div>
  </section>

  <section class="sheet" id="linksSheet" aria-label="Links">
    <div class="sheet-head"><span>Saint Jules</span><button class="sheet-close" data-close-sheet type="button" aria-label="Close">×</button></div>
    <div class="sheet-body links-grid" id="linksGrid"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    /* music-catalog:start */
    function firstMusicString(...values){
      for(const value of values){
        if(typeof value==="string"&&value.trim())return value.trim();
        if(typeof value==="number"&&Number.isFinite(value))return String(value);
      }
      return"";
    }
    function musicList(value){return Array.isArray(value)?value:[]}
    function musicEntityId(value){return value&&typeof value==="object"?firstMusicString(value.id,value.slug,value.key):firstMusicString(value)}
    function musicEntityTitle(value){return value&&typeof value==="object"?firstMusicString(value.title,value.name,value.label):firstMusicString(value)}
    function musicOrder(value,fallback=0){const number=Number(value);return Number.isFinite(number)?number:fallback}
    function safeMusicUrl(value,base){
      if(typeof value!=="string"||!value.trim())return null;
      try{const url=new URL(value.trim(),base);return["http:","https:"].includes(url.protocol)?url.href:null}catch{return null}
    }
    function musicDefaultFirst(root){
      const value=root.defaultFirst&&typeof root.defaultFirst==="object"
        ?root.defaultFirst
        :root.default_first&&typeof root.default_first==="object"?root.default_first:null;
      const kind=firstMusicString(value?.kind,value?.type).toLowerCase();
      const target=firstMusicString(value?.target,value?.id,value?.key,value?.name);
      return["track","release","playlist"].includes(kind)&&target?{kind,target}:null;
    }
    function normalizeCommunityCatalog(payload,options={}){
      const apiUrl=options.apiUrl||"https://room.saintjules.org/api/music";
      const startNumber=Number.isFinite(Number(options.startNumber))?Number(options.startNumber):1;
      const outer=payload&&typeof payload==="object"?payload:{};
      const root=outer.catalog&&typeof outer.catalog==="object"?outer.catalog:outer;
      const releases=musicList(root.releases);
      const playlists=musicList(root.playlists);
      const releaseByKey=new Map();
      const releaseByTitle=new Map();
      releases.forEach((release,index)=>{
        if(!release||typeof release!=="object")return;
        const key=musicEntityId(release)||`release-${index+1}`;
        const title=musicEntityTitle(release)||"Music";
        const normalized={
          key,title,
          type:firstMusicString(release.type,release.releaseType,release.release_type,"release").toLowerCase(),
          order:musicOrder(release.sortOrder??release.order,index),
          cover:safeMusicUrl(release.coverUrl||release.cover_url||release.artworkUrl||release.artwork_url||release.cover||release.image||release.artwork?.url,apiUrl),
          coverAlt:firstMusicString(release.artwork?.altText,release.artwork?.alt,release.coverAlt)
        };
        releaseByKey.set(key,normalized);releaseByTitle.set(title,normalized);
      });
      const playlistMemberships=new Map();
      playlists.forEach((playlist,index)=>{
        if(!playlist||typeof playlist!=="object")return;
        const key=musicEntityId(playlist)||`playlist-${index+1}`;
        const title=musicEntityTitle(playlist)||"Playlist";
        musicList(playlist.trackIds||playlist.track_ids||playlist.tracks).forEach(reference=>{
          const trackId=musicEntityId(reference);
          if(!trackId)return;
          const groups=playlistMemberships.get(trackId)||[];
          groups.push(key,title);playlistMemberships.set(trackId,[...new Set(groups)]);
        });
      });
      const candidates=[];
      musicList(root.tracks).forEach(track=>candidates.push({track}));
      releases.forEach(release=>musicList(release?.tracks).forEach(track=>{if(track&&typeof track==="object")candidates.push({track,release})}));
      playlists.forEach(playlist=>musicList(playlist?.tracks).forEach(track=>{if(track&&typeof track==="object")candidates.push({track,playlist})}));
      const seenIds=new Set();
      const seenSources=new Set();
      const groupOrder=new Map();
      const tracks=[];
      candidates.slice(0,500).forEach(({track,release:parentRelease,playlist:parentPlaylist},index)=>{
        if(!track||typeof track!=="object")return;
        const status=firstMusicString(track.status).toLowerCase();
        if(track.published===false||["draft","private","unpublished","deleted"].includes(status))return;
        const source=safeMusicUrl(track.audioUrl||track.audio_url||track.url||track.src||track.audio?.url,apiUrl);
        const title=firstMusicString(track.title,track.name);
        if(!source||!title||seenSources.has(source))return;
        const id=firstMusicString(track.id,track.slug,track.key)||`community-track-${index+1}`;
        if(seenIds.has(id))return;
        seenIds.add(id);seenSources.add(source);
        const rawRelease=track.release??track.album??parentRelease??parentPlaylist;
        let releaseGroup=firstMusicString(
          track.releaseGroup,track.release_group,track.releaseTitle,track.release_title,
          track.albumName,track.album_name,musicEntityTitle(rawRelease),"Singles"
        );
        const release=releaseByKey.get(firstMusicString(track.releaseId,track.release_id,track.albumId,track.album_id,musicEntityId(rawRelease)))||releaseByTitle.get(releaseGroup);
        releaseGroup=releaseGroup||release?.title||"Singles";
        const releaseType=firstMusicString(track.releaseType,track.release_type,release?.type,parentPlaylist?"playlist":"single").toLowerCase();
        const playlistGroups=[
          ...musicList(track.playlistIds||track.playlist_ids||track.playlists).flatMap(value=>[musicEntityId(value),musicEntityTitle(value)]),
          firstMusicString(track.playlistId,track.playlist_id,musicEntityId(track.playlist)),
          ...musicList(playlistMemberships.get(id)),
          ...(parentPlaylist?[musicEntityId(parentPlaylist),musicEntityTitle(parentPlaylist)]:[])
        ].filter(Boolean);
        if(!groupOrder.has(releaseGroup))groupOrder.set(releaseGroup,groupOrder.size);
        const cover=safeMusicUrl(track.coverUrl||track.cover_url||track.artworkUrl||track.artwork_url||track.cover||track.image||track.artwork?.url,apiUrl)||release?.cover||null;
        tracks.push({
          id,
          num:firstMusicString(track.num,track.number,track.trackNumber,track.track_number),
          title,
          artist:firstMusicString(track.artist,root.artist,outer.artist,"Saint Jules"),
          source,
          ...(cover?{cover}:{}),
          coverAlt:firstMusicString(track.artwork?.altText,track.artwork?.alt,track.coverAlt,release?.coverAlt,`${releaseGroup} cover`),
          releaseGroup,
          releaseTitle:releaseGroup,
          releaseType,
          releaseOrder:release?.order??groupOrder.get(releaseGroup),
          playlistGroups:[...new Set(playlistGroups)],
          trackOrder:musicOrder(track.trackOrder??track.track_order??track.sortOrder??track.sort_order??track.order,index),
          community:true
        });
      });
      const defaultFirst=musicDefaultFirst(root);
      tracks.sort((left,right)=>{
        const leftDefault=defaultFirst?.kind==="release"&&left.releaseGroup===defaultFirst.target||defaultFirst?.kind==="playlist"&&(left.releaseGroup===defaultFirst.target||left.playlistGroups.includes(defaultFirst.target))?-1:0;
        const rightDefault=defaultFirst?.kind==="release"&&right.releaseGroup===defaultFirst.target||defaultFirst?.kind==="playlist"&&(right.releaseGroup===defaultFirst.target||right.playlistGroups.includes(defaultFirst.target))?-1:0;
        if(leftDefault!==rightDefault)return leftDefault-rightDefault;
        if(left.releaseOrder!==right.releaseOrder)return left.releaseOrder-right.releaseOrder;
        if(left.releaseGroup!==right.releaseGroup)return left.releaseGroup.localeCompare(right.releaseGroup);
        return left.trackOrder-right.trackOrder;
      });
      tracks.forEach((track,index)=>{if(!track.num)track.num=String(startNumber+index).padStart(2,"0")});
      const selectedTrack=defaultFirst?.kind==="track"
        ?tracks.find(track=>track.id===defaultFirst.target)
        :defaultFirst?.kind==="release"
          ?tracks.find(track=>track.releaseGroup===defaultFirst.target)
          :defaultFirst?.kind==="playlist"
            ?tracks.find(track=>track.releaseGroup===defaultFirst.target||track.playlistGroups.includes(defaultFirst.target))
            :null;
      return{tracks,defaultTrackId:selectedTrack?.id||null,defaultFirst};
    }
    /* music-catalog:end */

    const fallbackCatalog = {
      artist:"Saint Jules",
      communityMusicApi:"https://room.saintjules.org/api/music",
      collections:[{
        id:"crash-dummy",
        title:"Lord Have Mercy, He's A Crash Dummy!",
        cover:"album-cover.jpeg",
        normalRoot:"Lord Have Mercy, He's A Crash Dummy!",
        orderRoot:"The Proposition comple",
        tracks:[
          {num:"01",title:"Boy Genius",normal:"01 Boy Genius.wav",album:"01 Boy genius interlude full.mp3"},
          {num:"02",title:"Jump!!!",normal:"02 Jump!!!.wav",album:"02 Jump!!!.wav"},
          {num:"03",title:"Come to Life",normal:"03 Come to Life.wav",album:"03 Come to Life.wav"},
          {num:"04",title:"The Proposition",normal:"04 The Proposition.wav",album:"04 The Proposition.wav"},
          {num:"05",title:"Rude",normal:"05 Rude.wav",album:"05 Rude.wav"},
          {num:"06",title:"PISA",normal:"06 PISA.wav",album:"06 Pisa Interlude full.wav"},
          {num:"07",title:"Apple Pie",normal:"07 Apple Pie.wav",album:"07 Apple Pie.wav"},
          {num:"08",title:"I Know",normal:"08 I Know..wav",album:"08 I Know..wav"},
          {num:"09",title:"Felt It? My Darling",normal:"09 Felt It?:My Darling .wav",album:"09 Felt It?:My Darling .wav"},
          {num:"10",title:"Crash Dummy",normal:"10 Crash Dummy.wav",album:"10 Crash Dummy interlude full.wav"},
          {num:"11",title:"Mr. Please",normal:"11 Mr.Please.wav",album:"11 Mr.Please.wav"},
          {num:"12",title:"WHO KNEW",normal:"12 WHO KNEW.wav",album:"12 WHO KNEW.wav"},
          {num:"13",title:"Sky Is Falling",normal:"13 Sky Is Falling.wav",album:"13 Sky Is Falling.wav"}
        ]
      }],
      links:{
        apple:"https://music.apple.com/us/album/the-proposition/1895704396?i=6764253201",
        spotify:"https://open.spotify.com/track/1P0PjFVnnYS2xWulb3ljlq",
        youtube:"https://www.youtube.com/@SaintJulezz",
        instagram:"https://www.instagram.com/saint__jules/",
        community:"https://room.saintjules.org/",
        minecraft:"minecraft/"
      }
    };

    const $=(s,r=document)=>r.querySelector(s);
    const $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const els={
      audio:$("#audio"),trackReel:$("#trackReel"),albumCard:$("#albumCard"),coverImage:$("#coverImage"),coverPlay:$("#coverPlay"),coverGlyph:$("#coverGlyph"),
      nowNum:$("#nowNum"),nowTitle:$("#nowTitle"),albumMode:$("#albumMode"),rollMode:$("#rollMode"),prevButton:$("#prevButton"),nextButton:$("#nextButton"),
      mainPlay:$("#mainPlay"),seek:$("#seek"),currentTime:$("#currentTime"),duration:$("#duration"),desktopList:$("#desktopList"),mobileList:$("#mobileList"),
      tracksButton:$("#tracksButton"),muteButton:$("#muteButton"),linksButton:$("#linksButton"),installButton:$("#installButton"),sheetScrim:$("#sheetScrim"),tracksSheet:$("#tracksSheet"),linksSheet:$("#linksSheet"),linksGrid:$("#linksGrid"),toast:$("#toast")
    };

    let installPrompt=null;
    if(window.matchMedia("(display-mode: standalone)").matches)els.installButton.hidden=true;
    window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});
    window.addEventListener("appinstalled",()=>{els.installButton.hidden=true;installPrompt=null});
    els.installButton.addEventListener("click",async()=>{
      if(installPrompt){
        await installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt=null;
        return;
      }
      const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
      say(ios?"Tap Share, then Add to Home Screen.":"Use the browser menu, then Install app or Add to Dock.");
    });
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

    let catalog=fallbackCatalog;
    let collection=fallbackCatalog.collections[0];
    let tracks=collection.tracks;
    let bundledTracks=collection.tracks;
    const state={index:0,mode:"album",dragging:false,dragStartX:0,dragX:0,dragMoved:false,reelTimer:0,userInteracted:false,appliedCommunityDefault:false};
    const communityMusicTimeoutMs=2500;

    function path(root,file){return [root,file].map(encodeURIComponent).join("/")}
    function sourceFor(track){return track.source||(state.mode==="album"?path(collection.orderRoot,track.album):path(collection.normalRoot,track.normal))}
    function formatTime(value){if(!Number.isFinite(value))return"0:00";const m=Math.floor(value/60);const s=Math.floor(value%60).toString().padStart(2,"0");return`${m}:${s}`}
    function say(text){els.toast.textContent=text;els.toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>els.toast.classList.remove("show"),1900)}

    function html(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char])}
    function safeRemoteUrl(value,base=document.baseURI){return safeMusicUrl(value,base)}
    async function fetchCommunityCatalog(apiUrl,startNumber){
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),communityMusicTimeoutMs);
      try{
        const response=await fetch(apiUrl,{cache:"no-store",headers:{Accept:"application/json"},signal:controller.signal});
        if(!response.ok)return null;
        return normalizeCommunityCatalog(await response.json(),{apiUrl,startNumber});
      }catch{return null}finally{clearTimeout(timeout)}
    }

    async function syncCommunityMusic(){
      const apiUrl=safeRemoteUrl(catalog.communityMusicApi);
      if(!apiUrl)return;
      const remoteCatalog=await fetchCommunityCatalog(apiUrl,bundledTracks.length+1);
      if(remoteCatalog===null)return;
      const selected=tracks[state.index];
      const selectedSource=selected?sourceFor(selected):"";
      const existingSources=new Set(bundledTracks.flatMap(track=>[
        safeRemoteUrl(path(collection.normalRoot,track.normal)),
        safeRemoteUrl(path(collection.orderRoot,track.album))
      ]).filter(Boolean));
      const uniqueAdditions=remoteCatalog.tracks.filter(track=>!existingSources.has(track.source));
      tracks=[...bundledTracks,...uniqueAdditions];
      collection={...collection,tracks};
      const remainingCollections=Array.isArray(catalog.collections)?catalog.collections.slice(1):[];
      catalog={...catalog,collections:[collection,...remainingCollections]};
      const preservedIndex=selectedSource?tracks.findIndex(track=>sourceFor(track)===selectedSource):-1;
      const defaultIndex=!state.userInteracted&&!state.appliedCommunityDefault&&remoteCatalog.defaultTrackId
        ?tracks.findIndex(track=>track.id===remoteCatalog.defaultTrackId)
        :-1;
      state.appliedCommunityDefault=true;
      if(defaultIndex>=0){state.index=defaultIndex;state.mode="album"}
      else if(preservedIndex>=0)state.index=preservedIndex;
      else if(state.index>=tracks.length)state.index=0;
      render();
      if(defaultIndex>=0||(preservedIndex<0&&selectedSource))setTrack(state.index,false);
    }

    async function loadCatalog(){
      try{
        const response=await fetch("catalog.json",{cache:"no-store"});
        if(!response.ok)throw new Error("catalog");
        catalog=await response.json();
        collection=catalog.collections?.[0]||fallbackCatalog.collections[0];
        tracks=collection.tracks||fallbackCatalog.collections[0].tracks;
      }catch{catalog=fallbackCatalog;collection=fallbackCatalog.collections[0];tracks=collection.tracks}
      bundledTracks=tracks.map((track,index)=>({
        ...track,
        id:track.id||`bundled-${collection.id||"release"}-${index+1}`,
        releaseId:collection.id||"bundled-release",
        releaseTitle:collection.title||"Music",
        releaseGroup:collection.title||"Music",
        releaseType:"album",
        bundled:true
      }));
      tracks=bundledTracks;
      collection={...collection,tracks};
      els.coverImage.src=collection.cover||"album-cover.jpeg";
      render();
      setTrack(0,false);
      await syncCommunityMusic();
      window.setInterval(()=>void syncCommunityMusic(),60_000);
    }

    function render(){
      els.trackReel.innerHTML=tracks.map((track,index)=>`<button class="chip ${index===state.index?"active":""}" data-track="${index}" type="button" aria-label="${html(track.title)}" aria-current="${index===state.index}">${html(track.num)}</button>`).join("");
      const grouped=[];
      tracks.forEach((track,index)=>{
        const title=track.releaseGroup||track.releaseTitle||collection.title||"Music";
        let group=grouped.find(entry=>entry.title===title);
        if(!group){group={title,tracks:[]};grouped.push(group)}
        group.tracks.push({track,index});
      });
      const rows=grouped.map(group=>`<section class="track-group" aria-label="${html(group.title)}"><div class="track-group-title">${html(group.title)}</div>${group.tracks.map(({track,index})=>`<button class="track-row ${index===state.index?"active":""}" data-track="${index}" type="button"><span>${html(track.num)}</span><span>${html(track.title)}</span></button>`).join("")}</section>`).join("");
      els.desktopList.innerHTML=rows;els.mobileList.innerHTML=rows;
      $$("[data-track]").forEach(button=>button.addEventListener("click",()=>{setTrack(Number(button.dataset.track),true,true,true);closeSheets()}));
      const selected=tracks[state.index];
      if(selected){
        els.nowNum.textContent=`${selected.num} / ${String(tracks.length).padStart(2,"0")}`;
        els.nowTitle.textContent=selected.title;
      }
      renderLinks();
    }

    function renderLinks(){
      const links=catalog.links||{};
      const entries=[
        ["Apple Music","apple-link",links.apple,true],
        ["Spotify","spotify-link",links.spotify,true],
        ["YouTube","youtube-link",links.youtube,true],
        ["Instagram","instagram-link",links.instagram,true],
        ["Music · Posts · Chat","community-link",links.community,false],
        ["Play Minecraft","minecraft-link",links.minecraft,false]
      ];
      els.linksGrid.innerHTML=entries.map(([name,cls,url,external])=>`<a class="brand-link ${cls} ${!url||url==="#"?"unset":""}" href="${url||"#"}" ${url&&url!=="#"&&external?'target="_blank" rel="noopener"':""}>${name}</a>`).join("");
      $$(".brand-link.unset",els.linksGrid).forEach(link=>link.addEventListener("click",event=>{event.preventDefault();say("Add this link in catalog.json.")}));
    }

    function setMode(mode,announce=true){
      state.mode=mode;
      els.albumMode.classList.toggle("active",mode==="album");
      els.rollMode.classList.toggle("active",mode==="roll");
      const wasPlaying=!els.audio.paused;
      const time=els.audio.currentTime||0;
      els.audio.src=sourceFor(tracks[state.index]);
      if(wasPlaying)els.audio.play().catch(()=>{});
      else if(time>0)els.audio.currentTime=0;
      if(announce)say(mode==="album"?"Album order — full versions.":"Roll mode — clean tracks.");
    }

    function setTrack(index,autoplay=false,scroll=true,userInitiated=false){
      if(userInitiated)state.userInteracted=true;
      state.index=(index+tracks.length)%tracks.length;
      const track=tracks[state.index];
      els.audio.src=sourceFor(track);
      els.coverImage.onerror=track.cover?()=>{els.coverImage.onerror=null;els.coverImage.src=collection.cover||"album-cover.jpeg"}:null;
      els.coverImage.src=track.cover||collection.cover||"album-cover.jpeg";
      els.coverImage.alt=track.coverAlt||`${track.releaseGroup||track.releaseTitle||collection.title||"Music"} cover`;
      els.nowNum.textContent=`${track.num} / ${String(tracks.length).padStart(2,"0")}`;
      els.nowTitle.textContent=track.title;
      els.seek.value="0";els.currentTime.textContent="0:00";els.duration.textContent="0:00";
      $$("[data-track]").forEach(node=>node.classList.toggle("active",Number(node.dataset.track)===state.index));
      $$(".chip",els.trackReel).forEach(node=>node.setAttribute("aria-current",String(Number(node.dataset.track)===state.index)));
      if(scroll){const chip=$(`.chip[data-track="${state.index}"]`,els.trackReel);chip?.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})}
      if(autoplay)play();else updatePlayUI();
    }

    async function play(){
      try{await els.audio.play();updatePlayUI()}catch{say("Tap play once more.")}
    }
    function pause(){els.audio.pause();updatePlayUI()}
    function togglePlay(){els.audio.paused?play():pause()}
    function updatePlayUI(){
      const playing=!els.audio.paused;
      const glyph=playing?"Ⅱ":"▶";
      els.coverGlyph.textContent=glyph;els.mainPlay.textContent=glyph;
      els.albumCard.classList.toggle("playing",playing);
      els.coverPlay.setAttribute("aria-label",playing?"Pause":"Play");
      els.mainPlay.setAttribute("aria-label",playing?"Pause":"Play");
    }

    function next(userInitiated=false){
      if(userInitiated)state.userInteracted=true;
      if(state.mode==="roll")return rollSong(userInitiated);
      setTrack(state.index+1,true,true,userInitiated);
    }
    function previous(userInitiated=false){setTrack(state.index-1,true,true,userInitiated)}
    function rollSong(userInitiated=false){
      if(userInitiated)state.userInteracted=true;
      if(tracks.length<2)return;
      let next=state.index;while(next===state.index)next=Math.floor(Math.random()*tracks.length);
      els.rollMode.classList.remove("rolling");void els.rollMode.offsetWidth;els.rollMode.classList.add("rolling");
      setMode("roll",false);setTimeout(()=>setTrack(next,true,true,userInitiated),180);
    }

    function openSheet(sheet){
      closeSheets();
      sheet.classList.add("open");
      els.sheetScrim.classList.add("open");
      if(sheet===els.tracksSheet){
        requestAnimationFrame(()=>{
          const active=$(".track-row.active",els.mobileList);
          active?.scrollIntoView({block:"center",behavior:"auto"});
        });
      }
    }
    function closeSheets(){$$(".sheet").forEach(sheet=>sheet.classList.remove("open"));els.sheetScrim.classList.remove("open")}

    function closestReelTrack(){
      const center=els.trackReel.getBoundingClientRect().left+els.trackReel.clientWidth/2;
      let best=0,dist=Infinity;
      $$(".chip",els.trackReel).forEach(chip=>{const r=chip.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-center);if(d<dist){dist=d;best=Number(chip.dataset.track)}});
      return best;
    }

    els.trackReel.addEventListener("scroll",()=>{
      clearTimeout(state.reelTimer);
      state.reelTimer=setTimeout(()=>{const index=closestReelTrack();if(index!==state.index)setTrack(index,false,false)},100);
    },{passive:true});
    els.trackReel.addEventListener("pointerdown",()=>{state.userInteracted=true},{passive:true});
    els.trackReel.addEventListener("wheel",()=>{state.userInteracted=true},{passive:true});

    els.albumCard.addEventListener("pointerdown",event=>{
      state.dragging=true;state.dragStartX=event.clientX;state.dragX=0;state.dragMoved=false;
      els.albumCard.classList.add("dragging");els.albumCard.setPointerCapture(event.pointerId);
    });
    els.albumCard.addEventListener("pointermove",event=>{
      if(!state.dragging)return;
      state.dragX=Math.max(-120,Math.min(120,event.clientX-state.dragStartX));
      if(Math.abs(state.dragX)>8)state.dragMoved=true;
      document.documentElement.style.setProperty("--card-x",`${state.dragX}px`);
    });
    function endCardDrag(){
      if(!state.dragging)return;
      state.dragging=false;els.albumCard.classList.remove("dragging");
      const delta=state.dragX;document.documentElement.style.setProperty("--card-x","0px");
      if(Math.abs(delta)>54){delta<0?setTrack(state.index+1,true,true,true):setTrack(state.index-1,true,true,true)}
      else if(!state.dragMoved){state.userInteracted=true;togglePlay()}
      state.dragX=0;
    }
    els.albumCard.addEventListener("pointerup",endCardDrag);
    els.albumCard.addEventListener("pointercancel",endCardDrag);
    els.coverPlay.addEventListener("click",event=>{event.preventDefault();event.stopPropagation()});

    els.albumMode.addEventListener("click",()=>{state.userInteracted=true;setMode("album")});
    els.rollMode.addEventListener("click",()=>rollSong(true));
    els.mainPlay.addEventListener("click",()=>{state.userInteracted=true;togglePlay()});
    els.prevButton.addEventListener("click",()=>previous(true));
    els.nextButton.addEventListener("click",()=>next(true));
    els.tracksButton.addEventListener("click",()=>openSheet(els.tracksSheet));
    els.linksButton.addEventListener("click",()=>openSheet(els.linksSheet));
    els.sheetScrim.addEventListener("click",closeSheets);
    $$('[data-close-sheet]').forEach(button=>button.addEventListener("click",closeSheets));
    els.muteButton.addEventListener("click",()=>{state.userInteracted=true;els.audio.muted=!els.audio.muted;els.muteButton.textContent=els.audio.muted?"sound off":"sound on"});

    els.audio.addEventListener("play",updatePlayUI);
    els.audio.addEventListener("pause",updatePlayUI);
    els.audio.addEventListener("ended",()=>next(false));
    els.audio.addEventListener("loadedmetadata",()=>els.duration.textContent=formatTime(els.audio.duration));
    els.audio.addEventListener("timeupdate",()=>{
      els.currentTime.textContent=formatTime(els.audio.currentTime);
      if(Number.isFinite(els.audio.duration)&&els.audio.duration>0)els.seek.value=String(Math.round(els.audio.currentTime/els.audio.duration*1000));
    });
    els.seek.addEventListener("input",()=>{state.userInteracted=true;if(Number.isFinite(els.audio.duration))els.audio.currentTime=Number(els.seek.value)/1000*els.audio.duration});

    window.addEventListener("keydown",event=>{if(event.key===" "){event.preventDefault();state.userInteracted=true;togglePlay()}if(event.key==="ArrowRight")next(true);if(event.key==="ArrowLeft")previous(true);if(event.key==="Escape")closeSheets()});

    loadCatalog();
  </script>
</body>
</html>
