<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efbfd0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saint Jules" />
  <meta name="description" content="Saint Jules — Lord Have Mercy, He's A Crash Dummy!" />
  <meta property="og:title" content="Saint Jules" />
  <meta property="og:description" content="Lord Have Mercy, He's A Crash Dummy!" />
  <meta property="og:image" content="album-cover.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Saint Jules</title>
  <style>
    :root {
      --pink: #f3a8bf;
      --hot-pink: #ff4f94;
      --blush: #efbfd0;
      --sky: #a9d9e8;
      --cream: #f4dfbd;
      --gold: #dcae65;
      --ink: #1d1719;
      --muted: rgba(29, 23, 25, .56);
      --line: rgba(255,255,255,.68);
      --glass: rgba(255,255,255,.30);
      --shadow: 0 32px 96px rgba(63, 27, 39, .24);
      --soft-shadow: 0 16px 46px rgba(63, 27, 39, .15);
      --mx: 0px;
      --my: 0px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --orbit-spin: 0deg;
      --ease: cubic-bezier(.2,.86,.2,1);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--blush);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--blush);
    }

    button, a, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; }
    img { display: block; max-width: 100%; }

    .backdrop {
      position: fixed;
      inset: -12vh -12vw;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at calc(50% + var(--mx)) calc(42% + var(--my)), rgba(255,255,255,.70), transparent 22%),
        radial-gradient(circle at 16% 20%, rgba(255,79,148,.40), transparent 29%),
        radial-gradient(circle at 84% 18%, rgba(169,217,232,.58), transparent 31%),
        radial-gradient(circle at 58% 88%, rgba(244,223,189,.72), transparent 39%),
        linear-gradient(135deg, #f5abc2, #d8edf4 48%, #f3ddb9);
    }

    .backdrop::before {
      content: "";
      position: absolute;
      inset: -10%;
      background: url("album-cover.jpeg") center / cover no-repeat;
      filter: blur(58px) saturate(1.18) contrast(.94);
      opacity: .42;
      transform: translate(calc(var(--mx) * -.12), calc(var(--my) * -.12)) scale(1.2);
    }

    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .60;
      background:
        radial-gradient(ellipse at center, transparent 0 34%, rgba(255,255,255,.18) 53%, rgba(255,238,231,.58) 100%),
        repeating-radial-gradient(circle at calc(50% + var(--mx)) calc(49% + var(--my)), rgba(255,255,255,.15) 0 1px, transparent 1px 16px),
        conic-gradient(from calc(var(--orbit-spin) * .12), transparent, rgba(255,255,255,.13), transparent, rgba(255,79,148,.11), transparent);
      mix-blend-mode: soft-light;
    }

    .glimmer,
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glimmer::before {
      content: "";
      position: absolute;
      top: -24vh;
      left: -42vw;
      width: 32vw;
      height: 150vh;
      opacity: 0;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.74), transparent);
      filter: blur(16px);
      transform: rotate(18deg) translateX(-20vw);
      animation: shimmer 11s var(--ease) infinite;
    }

    @keyframes shimmer {
      0%, 73% { opacity: 0; transform: rotate(18deg) translateX(-20vw); }
      79% { opacity: .58; }
      89%, 100% { opacity: 0; transform: rotate(18deg) translateX(170vw); }
    }

    .grain {
      z-index: 2;
      opacity: .12;
      mix-blend-mode: soft-light;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.9) 1px, transparent 0);
      background-size: 28px 28px;
    }

    .app {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding:
        max(16px, env(safe-area-inset-top))
        clamp(16px, 3vw, 42px)
        max(16px, env(safe-area-inset-bottom));
    }

    .topline {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .wordmark,
    .mini-now,
    .glass {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.26);
      -webkit-backdrop-filter: blur(24px) saturate(1.16);
      backdrop-filter: blur(24px) saturate(1.16);
      box-shadow: inset 0 1px rgba(255,255,255,.78), 0 14px 36px rgba(96,42,58,.12);
    }

    .wordmark,
    .mini-now {
      pointer-events: auto;
      min-height: 44px;
      border-radius: 999px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .34em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .mini-now {
      max-width: min(42vw, 390px);
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(29,23,25,.72);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--hot-pink);
      box-shadow: 0 0 0 0 rgba(255,79,148,.48);
      animation: pulse 1.9s infinite;
    }

    @keyframes pulse { 70%,100% { box-shadow: 0 0 0 14px rgba(255,79,148,0); } }

    .stage-grid {
      width: min(1380px, 100%);
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(500px, 1.35fr) minmax(310px, 430px);
      gap: clamp(24px, 5vw, 76px);
      align-items: center;
    }

    .universe {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      perspective: 1200px;
    }

    .orbit-shell {
      position: relative;
      width: min(68vw, 740px);
      max-width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .orbit-shell::before,
    .orbit-shell::after {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: 50%;
      pointer-events: none;
      z-index: -4;
    }

    .orbit-shell::before {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.35), transparent 30%),
        conic-gradient(from calc(var(--orbit-spin) + 18deg), rgba(255,79,148,.52), rgba(169,217,232,.46), rgba(244,223,189,.54), rgba(255,79,148,.52));
      filter: blur(34px);
      opacity: .7;
      animation: slowTurn 34s linear infinite;
    }

    .orbit-shell::after {
      inset: 10%;
      border: 1px solid rgba(255,255,255,.24);
      background: radial-gradient(circle at center, rgba(255,255,255,.25), transparent 63%);
      opacity: .82;
    }

    @keyframes slowTurn { to { rotate: 1turn; } }

    .ring {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      pointer-events: none;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform .25s var(--ease);
      z-index: -1;
    }

    .ring-line {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: inset 0 0 42px rgba(255,255,255,.12), 0 0 38px rgba(244,167,189,.22);
      transform: rotate(calc(var(--orbit-spin) * .18));
    }

    .ring-line:nth-child(2) { inset: 13%; opacity: .52; transform: rotate(66deg) scaleX(1.08); }
    .ring-line:nth-child(3) { inset: 22%; opacity: .40; transform: rotate(-34deg) scaleY(.94); }

    .album-object {
      position: relative;
      width: 52%;
      aspect-ratio: 1 / 1.07;
      display: grid;
      place-items: center;
      z-index: 2;
      transform-style: preserve-3d;
      transform: rotateX(calc(var(--tilt-x) * .82)) rotateY(calc(var(--tilt-y) * .82));
      transition: transform .24s var(--ease), filter .35s var(--ease);
      filter: drop-shadow(0 36px 62px rgba(62,28,38,.28));
    }

    .cover-wrap {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      border-radius: clamp(26px, 4vw, 38px);
      border: 1px solid rgba(255,255,255,.78);
      background: rgba(255,255,255,.24);
      box-shadow: inset 0 1px rgba(255,255,255,.86), 0 0 0 10px rgba(255,255,255,.1), var(--shadow);
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 0 37%, rgba(255,255,255,.48) 45%, transparent 54% 100%);
      mix-blend-mode: screen;
      transform: translateX(-60%);
      animation: coverFlash 9s var(--ease) infinite;
    }

    @keyframes coverFlash {
      0%, 69% { transform: translateX(-64%); opacity: 0; }
      75% { opacity: .66; }
      89%,100% { transform: translateX(64%); opacity: 0; }
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
    }

    .play-core {
      position: absolute;
      left: 50%;
      bottom: 4%;
      z-index: 5;
      width: clamp(58px, 8vw, 76px);
      height: clamp(58px, 8vw, 76px);
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 50%;
      background: rgba(255,255,255,.48);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: inset 0 1px rgba(255,255,255,.94), 0 16px 38px rgba(61,25,33,.24);
      font-size: 22px;
      font-weight: 950;
    }

    .play-core:active { transform: translateX(-50%) scale(.96); }

    .orbit-item {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      transform:
        translate(-50%, -50%)
        rotate(calc(var(--orbit-spin) + var(--angle)))
        translateX(var(--radius))
        rotate(calc(-1 * (var(--orbit-spin) + var(--angle))));
      will-change: transform;
    }

    .track-node,
    .link-node,
    .collection-node {
      border: 1px solid rgba(255,255,255,.7);
      -webkit-backdrop-filter: blur(16px) saturate(1.24);
      backdrop-filter: blur(16px) saturate(1.24);
      box-shadow: inset 0 1px rgba(255,255,255,.76), 0 12px 30px rgba(54,22,30,.16);
      transition: scale .24s var(--ease), background .24s var(--ease), box-shadow .24s var(--ease);
    }

    .track-node {
      --radius: 40%;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.32);
      font-size: 12px;
      font-weight: 950;
    }

    .track-node[aria-current="true"] {
      scale: 1.2;
      background: linear-gradient(180deg, #fff, #ffd4e1 52%, #f79ab8);
      border-color: rgba(255,255,255,.96);
      box-shadow: inset 0 1px rgba(255,255,255,.9), 0 14px 36px rgba(255,79,148,.30);
    }

    .link-node {
      --radius: 46%;
      min-width: 52px;
      height: 52px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .apple { --angle: 18deg; background: linear-gradient(135deg, #ff5d9d, #a974ff 62%, #5dd7ff); }
    .spotify { --angle: 110deg; background: #1ed760; color: #07130b; }
    .youtube { --angle: 222deg; background: #ff0033; }
    .instagram { --angle: 316deg; background: radial-gradient(circle at 30% 115%, #feda75, #fa7e1e 28%, #d62976 54%, #962fbf 74%, #4f5bd5); }

    .collection-node {
      --radius: 48%;
      width: 60px;
      height: 60px;
      display: none;
      padding: 0;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.28);
    }

    .collection-node.active { display: block; }
    .collection-node img { width: 100%; height: 100%; object-fit: cover; }

    .selection-card {
      position: absolute;
      left: 50%;
      bottom: 2%;
      z-index: 6;
      width: min(74%, 470px);
      transform: translateX(-50%);
      padding: 14px 18px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.34);
      -webkit-backdrop-filter: blur(24px) saturate(1.18);
      backdrop-filter: blur(24px) saturate(1.18);
      box-shadow: inset 0 1px rgba(255,255,255,.8), var(--soft-shadow);
      text-align: center;
    }

    .track-count {
      display: block;
      margin-bottom: 5px;
      color: rgba(29,23,25,.5);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .track-title-now {
      display: block;
      font-size: clamp(28px, 5vw, 50px);
      line-height: .92;
      letter-spacing: -.06em;
      font-weight: 950;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side {
      min-width: 0;
      display: grid;
      gap: 14px;
      align-content: center;
    }

    .title-stack,
    .controls,
    .progress-card,
    .track-list,
    .mobile-now {
      border: 1px solid rgba(255,255,255,.66);
      background: rgba(255,255,255,.27);
      -webkit-backdrop-filter: blur(24px) saturate(1.14);
      backdrop-filter: blur(24px) saturate(1.14);
      box-shadow: inset 0 1px rgba(255,255,255,.72), var(--soft-shadow);
    }

    .title-stack {
      padding: 22px;
      border-radius: 34px;
    }

    .title-stack h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 88px);
      line-height: .86;
      letter-spacing: -.08em;
      text-transform: lowercase;
    }

    .title-stack p {
      margin: 12px 0 0;
      color: rgba(29,23,25,.64);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 800;
    }

    .mobile-now { display: none; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      padding: 7px;
      border-radius: 999px;
    }

    .mode-btn,
    .tracks-toggle {
      height: 42px;
      min-width: 88px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(29,23,25,.64);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
      transition: background .24s var(--ease), color .24s var(--ease), transform .24s var(--ease);
    }

    .mode-btn.active,
    .tracks-toggle.active {
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,211,224,.86));
      box-shadow: 0 8px 18px rgba(255,79,148,.14);
    }

    .mode-btn:active,
    .tracks-toggle:active { transform: scale(.97); }

    .track-list {
      display: grid;
      gap: 6px;
      max-height: min(54vh, 560px);
      overflow: auto;
      padding: 10px;
      border-radius: 30px;
      scrollbar-width: none;
    }

    .track-list::-webkit-scrollbar { display: none; }

    .row {
      width: 100%;
      padding: 12px;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: center;
      border: 0;
      border-radius: 18px;
      background: transparent;
      text-align: left;
      transition: background .22s var(--ease), transform .22s var(--ease);
    }

    .row:hover,
    .row.active { background: rgba(255,255,255,.40); transform: translateY(-1px); }

    .row-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.38);
      font-size: 12px;
      font-weight: 950;
    }

    .row-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 880;
      letter-spacing: -.02em;
    }

    .progress-card {
      padding: 10px 13px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
      align-items: center;
      border-radius: 999px;
      color: rgba(29,23,25,.58);
      font-size: 12px;
      font-weight: 850;
    }

    .range { width: 100%; accent-color: var(--hot-pink); }

    .hint {
      min-height: 18px;
      color: rgba(29,23,25,.5);
      text-align: center;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      background: rgba(66,30,42,.10);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      transition: opacity .25s var(--ease);
    }

    .drawer-scrim.open { opacity: 1; pointer-events: auto; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px);
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 999px;
      background: rgba(255,255,255,.46);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: var(--soft-shadow);
      color: rgba(29,23,25,.72);
      font-size: 13px;
      font-weight: 900;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    html.orbit-dragging .track-node,
    html.orbit-dragging .link-node,
    html.orbit-dragging .collection-node,
    html.orbit-dragging .ring,
    html.orbit-dragging .album-object {
      transition: none !important;
    }

    @media (max-width: 900px) {
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        min-height: 100dvh;
        position: relative;
      }

      .backdrop { inset: -8vh -16vw; }
      .backdrop::before { filter: blur(46px) saturate(1.18); opacity: .38; }

      .app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        gap: 8px;
        overflow: hidden;
        padding:
          max(10px, env(safe-area-inset-top))
          10px
          max(10px, env(safe-area-inset-bottom));
      }

      .topline { min-height: 46px; }
      .wordmark { min-height: 42px; padding: 0 17px; font-size: 11px; letter-spacing: .28em; }
      .mini-now { display: none; }

      .stage-grid {
        width: 100%;
        height: 100%;
        min-height: 0;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: stretch;
      }

      .universe {
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .orbit-shell {
        width: min(calc(100vw - 20px), calc(100dvh - 252px), 540px);
        min-width: 286px;
        max-width: 100%;
      }

      .orbit-shell::before { inset: 2%; filter: blur(24px); opacity: .66; }
      .orbit-shell::after { inset: 8%; }
      .ring { inset: 5%; }

      .album-object { width: 55%; }
      .cover-wrap { border-radius: 27px; box-shadow: inset 0 1px rgba(255,255,255,.86), 0 0 0 7px rgba(255,255,255,.1), var(--shadow); }
      .play-core { width: 60px; height: 60px; bottom: 2%; font-size: 19px; }

      .track-node {
        --radius: 39%;
        width: 38px;
        height: 38px;
        font-size: 11px;
      }

      .track-node[aria-current="true"] { scale: 1.17; }

      .link-node {
        --radius: 44%;
        min-width: 44px;
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 0;
        letter-spacing: 0;
      }

      .link-node::after { font-size: 11px; font-weight: 950; letter-spacing: .06em; }
      .apple::after { content: "AM"; }
      .spotify::after { content: "SP"; }
      .youtube::after { content: "YT"; }
      .instagram::after { content: "IG"; }

      .selection-card { display: none; }

      .side {
        min-height: 0;
        align-content: end;
        gap: 7px;
        z-index: 9;
      }

      .title-stack,
      .hint { display: none; }

      .mobile-now {

    function nearestTarget(index){const canonical=-mod(index,tracks.length)*segment();return state.spin+normalizeAngle(canonical-state.spin);}
    function snapSpinToIndex(index,animate=true){
      cancelAnimationFrame(state.inertiaFrame);const target=nearestTarget(index);
      if(!animate||matchMedia("(prefers-reduced-motion: reduce)").matches){applySpin(target);return;}
      const start=state.spin,delta=target-start,duration=matchMedia("(max-width:900px)").matches?210:280,started=performance.now();

      state.inertiaFrame=requestAnimationFrame(tick);
    }

    function loadTrack(index,mode){const t=tracks[mod(index,tracks.length)],src=srcFor(t,mode);if(state.loadedSrc!==src){state.loadedSrc=src;els.audio.src=src;els.audio.load();}}
    function selectTrack(index,autoplay=false,mode=state.mode,animate=true){const next=mod(index,tracks.length);setMode(mode);setCurrentUI(next);snapSpinToIndex(next,animate);loadTrack(next,mode);if(autoplay)play();}
    async function play(){try{if(!state.loadedSrc)loadTrack(state.current,state.mode);await els.audio.play();}catch{toast("tap play");}updatePlayIcon();}
    function pause(){els.audio.pause();updatePlayIcon();}
    function stop(){els.audio.pause();try{els.audio.currentTime=0;}catch{}updatePlayIcon();updateProgressUI();}
    function updatePlayIcon(){const playing=!els.audio.paused;els.playGlyph.textContent=playing?"Ⅱ":"▶";els.coverState.textContent=playing?"pause":"play";els.playPause.classList.toggle("is-playing",playing);els.albumObject.classList.toggle("is-playing",playing);els.playPause.setAttribute("aria-label",playing?"Pause":"Play");}
    function updateProgressUI(){const d=els.audio.duration,c=els.audio.currentTime||0,r=Number.isFinite(d)&&d>0?c/d:0;els.currentTime.textContent=formatTime(c);els.duration.textContent=formatTime(d);els.seek.value=String(Math.round(r*1000));$(".cover-control-disc",els.playPause)?.style.setProperty("--cover-progress",`${r*360}deg`);}
    function shuffle(autoplay=true){let next=Math.floor(Math.random()*tracks.length);if(tracks.length>1&&next===state.current)next=(next+1)%tracks.length;selectTrack(next,autoplay,"shuffle",true);}
    function commitOrbitSelection(){selectTrack(indexFromSpin(),!els.audio.paused&&!!state.loadedSrc,"shuffle",true);}
    function startInertia(){
      cancelAnimationFrame(state.inertiaFrame);let v=clamp(state.velocity,-9,9),last=state.current;
      const tick=()=>{v*=.84;applySpin(state.spin+v);const preview=indexFromSpin();if(preview!==last){last=preview;setCurrentUI(preview);}if(Math.abs(v)>.32)state.inertiaFrame=requestAnimationFrame(tick);else commitOrbitSelection();};
      if(Math.abs(v)>.55)state.inertiaFrame=requestAnimationFrame(tick);else commitOrbitSelection();
    }

    function startOrbitDrag(e){
      if(e.button!==undefined&&e.button!==0)return;if(e.target.closest(".cover-wrap,.cover-tools,.volume-popover"))return;
      cancelAnimationFrame(state.inertiaFrame);state.dragging=true;state.moved=false;state.pointerId=e.pointerId;state.startX=e.clientX;state.startY=e.clientY;state.lastAngle=angleFromEvent(e);state.lastTime=performance.now();state.velocity=0;els.root.classList.add("orbit-dragging");try{els.orbitShell.setPointerCapture(e.pointerId);}catch{}enableSensors();
    }
    els.orbitShell.addEventListener("pointerdown",startOrbitDrag,{capture:true});
    els.orbitShell.addEventListener("pointermove",e=>{
      const r=els.orbitShell.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;state.sceneTargetX=x*34;state.sceneTargetY=y*28;scheduleSensorFrame();
      if(!state.dragging||e.pointerId!==state.pointerId)return;e.preventDefault();const sample=e.getCoalescedEvents?.().at(-1)||e,now=performance.now(),angle=angleFromEvent(sample),delta=normalizeAngle(angle-state.lastAngle),elapsed=Math.max(8,now-state.lastTime),distance=Math.hypot(sample.clientX-state.startX,sample.clientY-state.startY);
      if(distance>5)state.moved=true;if(state.moved&&Math.abs(delta)>.02){const next=state.spin+delta;state.spin=next;queueSpin(next);state.velocity=state.velocity*.48+(delta/elapsed)*16.67*.52;const preview=indexFromSpin();if(preview!==state.current)setCurrentUI(preview);}state.lastAngle=angle;state.lastTime=now;
    },{passive:false});
    function endOrbitDrag(e){if(!state.dragging||e.pointerId!==state.pointerId)return;state.dragging=false;state.pointerId=null;els.root.classList.remove("orbit-dragging");try{els.orbitShell.releasePointerCapture(e.pointerId);}catch{}if(state.moved){state.suppressClicksUntil=performance.now()+420;startInertia();}}
    els.orbitShell.addEventListener("pointerup",endOrbitDrag);els.orbitShell.addEventListener("pointercancel",endOrbitDrag);els.orbitShell.addEventListener("lostpointercapture",e=>{if(state.dragging&&e.pointerId===state.pointerId)endOrbitDrag(e);});
    els.orbitShell.addEventListener("click",e=>{if(performance.now()<state.suppressClicksUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
    els.orbitShell.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)<4&&Math.abs(e.deltaX)<4)return;e.preventDefault();const dir=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?Math.sign(e.deltaY):Math.sign(e.deltaX);selectTrack(state.current+dir,!els.audio.paused&&!!state.loadedSrc,"shuffle",true);},{passive:false});

    function showProjectScrub(open){els.projectScrub.classList.toggle("open",open);els.projectScrub.setAttribute("aria-hidden",String(!open));}
    function renderProjectDots(preview=state.activeCollection){els.projectDots.innerHTML=collections.map((_,i)=>`<i class="${i===preview?"active":""}"></i>`).join("");els.projectName.textContent=collections[preview]?.title||collections[state.activeCollection].title;}
    function switchCollection(index){if(!collections.length)return;const next=mod(index,collections.length);if(next===state.activeCollection)return;stop();state.activeCollection=next;tracks=collections[next].tracks;state.current=0;state.loadedSrc="";els.coverImage.src=collections[next].cover||"album-cover.jpeg";renderNodes();renderTrackList();renderProjectDots();setMode("order");applySpin(0);setCurrentUI(0);loadTrack(0,"order");toast(collections[next].title);}

    function startCoverGesture(e){
      if(e.button!==undefined&&e.button!==0)return;if(e.target.closest(".cover-tools,.volume-popover"))return;const g=state.coverGesture;g.active=true;g.long=false;g.pointerId=e.pointerId;g.startX=e.clientX;g.startY=e.clientY;g.startVolume=els.audio.volume;g.projectOffset=0;g.moved=false;g.suppressClick=false;els.playPause.classList.add("is-pressing");try{els.playPause.setPointerCapture(e.pointerId);}catch{}clearTimeout(g.timer);g.timer=setTimeout(()=>{if(!g.active)return;g.long=true;g.suppressClick=true;showProjectScrub(true);renderProjectDots();navigator.vibrate?.(12);},380);enableSensors();
    }
    function moveCoverGesture(e){
      const g=state.coverGesture;if(!g.active||e.pointerId!==g.pointerId)return;const dx=e.clientX-g.startX,dy=e.clientY-g.startY,d=Math.hypot(dx,dy);if(d>8)g.moved=true;if(!g.long){if(d>14)clearTimeout(g.timer);return;}e.preventDefault();if(Math.abs(dy)>Math.abs(dx)){const v=clamp(g.startVolume-dy/170,0,1);setVolume(v);els.projectName.textContent=`volume ${Math.round(v*100)}`;}else if(collections.length>1){g.projectOffset=Math.round(-dx/92);renderProjectDots(mod(state.activeCollection+g.projectOffset,collections.length));}
    }
    function endCoverGesture(e){
      const g=state.coverGesture;if(!g.active||e.pointerId!==g.pointerId)return;clearTimeout(g.timer);g.active=false;els.playPause.classList.remove("is-pressing");try{els.playPause.releasePointerCapture(e.pointerId);}catch{}if(g.long){if(collections.length>1&&g.projectOffset)switchCollection(state.activeCollection+g.projectOffset);showProjectScrub(false);setTimeout(()=>g.suppressClick=false,80);return;}if(!g.moved){els.audio.paused?play():pause();}
    }
    els.playPause.addEventListener("pointerdown",startCoverGesture);els.playPause.addEventListener("pointermove",moveCoverGesture,{passive:false});els.playPause.addEventListener("pointerup",endCoverGesture);els.playPause.addEventListener("pointercancel",endCoverGesture);
    els.playPause.addEventListener("click",e=>{if(e.detail!==0||state.coverGesture.suppressClick){e.preventDefault();return;}els.audio.paused?play():pause();enableSensors();});

    els.stopBtn.addEventListener("pointerdown",e=>e.stopPropagation());els.stopBtn.addEventListener("click",e=>{e.stopPropagation();stop();enableSensors();});
    function setVolume(value){const v=clamp(Number(value),0,1);els.audio.volume=v;els.volumeRange.value=String(v);els.volumeBtn.style.opacity=v===0?".55":"1";}
    function toggleVolume(force){const open=typeof force==="boolean"?force:!els.volumePopover.classList.contains("open");els.volumePopover.classList.toggle("open",open);els.volumePopover.setAttribute("aria-hidden",String(!open));els.volumeBtn.setAttribute("aria-expanded",String(open));}
    els.volumeBtn.addEventListener("pointerdown",e=>e.stopPropagation());els.volumeBtn.addEventListener("click",e=>{e.stopPropagation();toggleVolume();enableSensors();});els.volumeRange.addEventListener("pointerdown",e=>e.stopPropagation());els.volumeRange.addEventListener("input",()=>setVolume(els.volumeRange.value));

    els.orderBtn.addEventListener("click",()=>{selectTrack(0,true,"order",true);enableSensors();});els.shuffleBtn.addEventListener("click",()=>{shuffle(true);enableSensors();});els.trackToggle.addEventListener("click",()=>toggleTracks());els.drawerScrim.addEventListener("click",()=>toggleTracks(false));
    els.audio.addEventListener("play",updatePlayIcon);els.audio.addEventListener("pause",updatePlayIcon);els.audio.addEventListener("ended",()=>state.mode==="order"?selectTrack(state.current+1,true,"order",true):shuffle(true));els.audio.addEventListener("loadedmetadata",updateProgressUI);els.audio.addEventListener("durationchange",updateProgressUI);els.audio.addEventListener("timeupdate",updateProgressUI);els.audio.addEventListener("volumechange",()=>{els.volumeRange.value=String(els.audio.volume);});
    els.seek.addEventListener("input",()=>{if(Number.isFinite(els.audio.duration)){els.audio.currentTime=(Number(els.seek.value)/1000)*els.audio.duration;updateProgressUI();}});
    document.addEventListener("pointerdown",e=>{if(!e.target.closest(".volume-popover,#volumeBtn"))toggleVolume(false);});

    document.addEventListener("pointermove",e=>{if(matchMedia("(max-width:900px)").matches||state.dragging)return;const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;state.tiltTargetY=x*6;state.tiltTargetX=y*-5;state.sceneTargetX=x*24;state.sceneTargetY=y*20;scheduleSensorFrame();},{passive:true});
    function scheduleSensorFrame(){if(state.sensorFrame)return;state.sensorFrame=requestAnimationFrame(updateSensorFrame);}
    function updateSensorFrame(){state.sensorFrame=0;state.tiltCurrentX+=(state.tiltTargetX-state.tiltCurrentX)*.14;state.tiltCurrentY+=(state.tiltTargetY-state.tiltCurrentY)*.14;state.sceneCurrentX+=(state.sceneTargetX-state.sceneCurrentX)*.1;state.sceneCurrentY+=(state.sceneTargetY-state.sceneCurrentY)*.1;els.orbitShell.style.setProperty("--tilt-x",`${state.tiltCurrentX}deg`);els.orbitShell.style.setProperty("--tilt-y",`${state.tiltCurrentY}deg`);els.root.style.setProperty("--mx",`${state.sceneCurrentX}px`);els.root.style.setProperty("--my",`${state.sceneCurrentY}px`);const moving=Math.abs(state.tiltTargetX-state.tiltCurrentX)>.03||Math.abs(state.tiltTargetY-state.tiltCurrentY)>.03||Math.abs(state.sceneTargetX-state.sceneCurrentX)>.08||Math.abs(state.sceneTargetY-state.sceneCurrentY)>.08;if(moving&&document.visibilityState==="visible")scheduleSensorFrame();}
    function onOrientation(e){if(state.dragging||state.coverGesture.active||document.visibilityState!=="visible")return;const gamma=clamp(e.gamma||0,-26,26),beta=clamp((e.beta||0)-40,-28,28);state.tiltTargetY=gamma*.34;state.tiltTargetX=beta*-.23;state.sceneTargetX=gamma*.62;state.sceneTargetY=beta*.45;scheduleSensorFrame();}
    function onMotion(e){if(document.visibilityState!=="visible"||state.dragging||state.coverGesture.active)return;const a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;const sample={x:Number(a.x||0),y:Number(a.y||0),z:Number(a.z||0)};if(state.lastAcceleration){const jerk=Math.abs(sample.x-state.lastAcceleration.x)+Math.abs(sample.y-state.lastAcceleration.y)+Math.abs(sample.z-state.lastAcceleration.z);state.shakeScore=state.shakeScore*.72+jerk;const now=performance.now();if(state.shakeScore>31&&now-state.lastShakeAt>1450){state.lastShakeAt=now;state.shakeScore=0;shuffle(true);navigator.vibrate?.([10,30,10]);}}state.lastAcceleration=sample;}
    async function enableSensors(){
      if(state.sensorStatus==="ready"||state.sensorStatus==="requesting")return;
      state.sensorStatus="requesting";
      try{
        const orientationRequest=window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"
          ? DeviceOrientationEvent.requestPermission()
          : Promise.resolve(window.DeviceOrientationEvent?"granted":"denied");
        const motionRequest=window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==="function"
          ? DeviceMotionEvent.requestPermission()
          : Promise.resolve(window.DeviceMotionEvent?"granted":"denied");
        const [orientationResult,motionResult]=await Promise.allSettled([orientationRequest,motionRequest]);
        const orientationGranted=orientationResult.status==="fulfilled"&&orientationResult.value==="granted";
        const motionGranted=motionResult.status==="fulfilled"&&motionResult.value==="granted";
        if(orientationGranted)addEventListener("deviceorientation",onOrientation,true);
        if(motionGranted)addEventListener("devicemotion",onMotion,true);
        state.sensorStatus=orientationGranted||motionGranted?"ready":"denied";
      }catch{state.sensorStatus="denied";}
    }
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"){state.lastAcceleration=null;state.shakeScore=0;}});

    async function discoverFolder(folderName){
      try{const response=await fetch(`${encodeURIComponent(folderName)}/manifest.json`,{cache:"no-store"});if(response.ok){const data=await response.json(),list=(data.tracks||[]).map((t,i)=>({num:t.num||String(i+1).padStart(2,"0"),title:t.title||`Track ${i+1}`,directSrc:t.src}));if(list.length)return{id:folderName,title:data.title||folderName,cover:data.cover||"album-cover.jpeg",tracks:list};}}catch{}
      try{const response=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURIComponent(folderName)}?ref=${branch}`,{headers:{Accept:"application/vnd.github+json"}});if(!response.ok)return null;const entries=await response.json(),audio=entries.filter(f=>/\.(mp3|wav|m4a|aac|ogg)$/i.test(f.name)),image=entries.find(f=>/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));if(!audio.length)return null;return{id:folderName,title:folderName,cover:image?.download_url||"album-cover.jpeg",tracks:audio.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map((f,i)=>({num:String(i+1).padStart(2,"0"),title:f.name.replace(/\.(mp3|wav|m4a|aac|ogg)$/i,"").replace(/^\d+\s*/,""),directSrc:f.download_url}))};}catch{return null;}
    }
    async function collectionFolders(){try{const response=await fetch("collections.json",{cache:"no-store"});if(response.ok){const data=await response.json();if(Array.isArray(data))return data.map(x=>typeof x==="string"?x:x.folder).filter(Boolean);}}catch{}return["Jasper"];}
    async function bootExtraCollections(){for(const folder of await collectionFolders()){const c=await discoverFolder(folder);if(c)collections.push(c);}renderProjectDots();if(collections.length<2)return;const next=collections[1];els.collectionNode.innerHTML=`<img src="${next.cover}" alt="${next.title}">`;els.collectionNode.classList.add("active");els.collectionNode.style.setProperty("--angle","72deg");els.collectionNode.addEventListener("click",e=>{if(performance.now()<state.suppressClicksUntil){e.preventDefault();return;}e.stopPropagation();switchCollection(state.activeCollection+1);});}
    for(const link of $$(".link-node",els.orbitShell))link.addEventListener("click",e=>{if(performance.now()<state.suppressClicksUntil){e.preventDefault();return;}if(link.getAttribute("href")==="#"){e.preventDefault();toast(link.getAttribute("aria-label"));}});
    let orbitResizeFrame=0;
    const scheduleOrbitLayout=()=>{if(orbitResizeFrame)return;orbitResizeFrame=requestAnimationFrame(()=>{orbitResizeFrame=0;layoutOrbit();});};
    addEventListener("resize",scheduleOrbitLayout,{passive:true});
    visualViewport?.addEventListener("resize",scheduleOrbitLayout,{passive:true});
    addEventListener("orientationchange",()=>setTimeout(scheduleOrbitLayout,180),{passive:true});

    renderNodes();renderTrackList();renderProjectDots();applySpin(0);setCurrentUI(0);loadTrack(0,"order");setVolume(1);updatePlayIcon();updateProgressUI();bootExtraCollections();

  </script>
