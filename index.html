<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efbfd0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saint Jules" />
  <meta name="description" content="Saint Jules — Lord Have Mercy, He's A Crash Dummy!" />
  <meta property="og:title" content="Saint Jules" />
  <meta property="og:description" content="Lord Have Mercy, He's A Crash Dummy!" />
  <meta property="og:image" content="album-cover.jpeg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Saint Jules</title>
  <style>
    :root {
      --pink: #f3a8bf;
      --hot-pink: #ff4f94;
      --blush: #efbfd0;
      --sky: #a9d9e8;
      --cream: #f4dfbd;
      --gold: #dcae65;
      --ink: #1d1719;
      --muted: rgba(29, 23, 25, .56);
      --line: rgba(255,255,255,.68);
      --glass: rgba(255,255,255,.30);
      --shadow: 0 32px 96px rgba(63, 27, 39, .24);
      --soft-shadow: 0 16px 46px rgba(63, 27, 39, .15);
      --mx: 0px;
      --my: 0px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --orbit-spin: 0deg;
      --ease: cubic-bezier(.2,.86,.2,1);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--blush);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--blush);
    }

    button, a, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; }
    img { display: block; max-width: 100%; }

    .backdrop {
      position: fixed;
      inset: -12vh -12vw;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at calc(50% + var(--mx)) calc(42% + var(--my)), rgba(255,255,255,.70), transparent 22%),
        radial-gradient(circle at 16% 20%, rgba(255,79,148,.40), transparent 29%),
        radial-gradient(circle at 84% 18%, rgba(169,217,232,.58), transparent 31%),
        radial-gradient(circle at 58% 88%, rgba(244,223,189,.72), transparent 39%),
        linear-gradient(135deg, #f5abc2, #d8edf4 48%, #f3ddb9);
    }

    .backdrop::before {
      content: "";
      position: absolute;
      inset: -10%;
      background: url("album-cover.jpeg") center / cover no-repeat;
      filter: blur(58px) saturate(1.18) contrast(.94);
      opacity: .42;
      transform: translate(calc(var(--mx) * -.12), calc(var(--my) * -.12)) scale(1.2);
    }

    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .60;
      background:
        radial-gradient(ellipse at center, transparent 0 34%, rgba(255,255,255,.18) 53%, rgba(255,238,231,.58) 100%),
        repeating-radial-gradient(circle at calc(50% + var(--mx)) calc(49% + var(--my)), rgba(255,255,255,.15) 0 1px, transparent 1px 16px),
        conic-gradient(from calc(var(--orbit-spin) * .12), transparent, rgba(255,255,255,.13), transparent, rgba(255,79,148,.11), transparent);
      mix-blend-mode: soft-light;
    }

    .glimmer,
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glimmer::before {
      content: "";
      position: absolute;
      top: -24vh;
      left: -42vw;
      width: 32vw;
      height: 150vh;
      opacity: 0;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.74), transparent);
      filter: blur(16px);
      transform: rotate(18deg) translateX(-20vw);
      animation: shimmer 11s var(--ease) infinite;
    }

    @keyframes shimmer {
      0%, 73% { opacity: 0; transform: rotate(18deg) translateX(-20vw); }
      79% { opacity: .58; }
      89%, 100% { opacity: 0; transform: rotate(18deg) translateX(170vw); }
    }

    .grain {
      z-index: 2;
      opacity: .12;
      mix-blend-mode: soft-light;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.9) 1px, transparent 0);
      background-size: 28px 28px;
    }

    .app {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding:
        max(16px, env(safe-area-inset-top))
        clamp(16px, 3vw, 42px)
        max(16px, env(safe-area-inset-bottom));
    }

    .topline {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .wordmark,
    .mini-now,
    .glass {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.26);
      -webkit-backdrop-filter: blur(24px) saturate(1.16);
      backdrop-filter: blur(24px) saturate(1.16);
      box-shadow: inset 0 1px rgba(255,255,255,.78), 0 14px 36px rgba(96,42,58,.12);
    }

    .wordmark,
    .mini-now {
      pointer-events: auto;
      min-height: 44px;
      border-radius: 999px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .34em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .mini-now {
      max-width: min(42vw, 390px);
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(29,23,25,.72);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--hot-pink);
      box-shadow: 0 0 0 0 rgba(255,79,148,.48);
      animation: pulse 1.9s infinite;
    }

    @keyframes pulse { 70%,100% { box-shadow: 0 0 0 14px rgba(255,79,148,0); } }

    .stage-grid {
      width: min(1380px, 100%);
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(500px, 1.35fr) minmax(310px, 430px);
      gap: clamp(24px, 5vw, 76px);
      align-items: center;
    }

    .universe {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: visible;
      perspective: 1200px;
    }

    .orbit-shell {
      position: relative;
      width: min(68vw, 740px);
      max-width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .orbit-shell::before,
    .orbit-shell::after {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: 50%;
      pointer-events: none;
      z-index: -4;
    }

    .orbit-shell::before {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.35), transparent 30%),
        conic-gradient(from calc(var(--orbit-spin) + 18deg), rgba(255,79,148,.52), rgba(169,217,232,.46), rgba(244,223,189,.54), rgba(255,79,148,.52));
      filter: blur(34px);
      opacity: .7;
      animation: slowTurn 34s linear infinite;
    }

    .orbit-shell::after {
      inset: 10%;
      border: 1px solid rgba(255,255,255,.24);
      background: radial-gradient(circle at center, rgba(255,255,255,.25), transparent 63%);
      opacity: .82;
    }

    @keyframes slowTurn { to { rotate: 1turn; } }

    .ring {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      pointer-events: none;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform .25s var(--ease);
      z-index: -1;
    }

    .ring-line {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: inset 0 0 42px rgba(255,255,255,.12), 0 0 38px rgba(244,167,189,.22);
      transform: rotate(calc(var(--orbit-spin) * .18));
    }

    .ring-line:nth-child(2) { inset: 13%; opacity: .52; transform: rotate(66deg) scaleX(1.08); }
    .ring-line:nth-child(3) { inset: 22%; opacity: .40; transform: rotate(-34deg) scaleY(.94); }

    .album-object {
      position: relative;
      width: 52%;
      aspect-ratio: 1 / 1.07;
      display: grid;
      place-items: center;
      z-index: 2;
      transform-style: preserve-3d;
      transform: rotateX(calc(var(--tilt-x) * .82)) rotateY(calc(var(--tilt-y) * .82));
      transition: transform .24s var(--ease), filter .35s var(--ease);
      filter: drop-shadow(0 36px 62px rgba(62,28,38,.28));
    }

    .cover-wrap {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      border-radius: clamp(26px, 4vw, 38px);
      border: 1px solid rgba(255,255,255,.78);
      background: rgba(255,255,255,.24);
      box-shadow: inset 0 1px rgba(255,255,255,.86), 0 0 0 10px rgba(255,255,255,.1), var(--shadow);
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(120deg, transparent 0 37%, rgba(255,255,255,.48) 45%, transparent 54% 100%);
      mix-blend-mode: screen;
      transform: translateX(-60%);
      animation: coverFlash 9s var(--ease) infinite;
    }

    @keyframes coverFlash {
      0%, 69% { transform: translateX(-64%); opacity: 0; }
      75% { opacity: .66; }
      89%,100% { transform: translateX(64%); opacity: 0; }
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
    }

    .play-core {
      position: absolute;
      left: 50%;
      bottom: 4%;
      z-index: 5;
      width: clamp(58px, 8vw, 76px);
      height: clamp(58px, 8vw, 76px);
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 50%;
      background: rgba(255,255,255,.48);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: inset 0 1px rgba(255,255,255,.94), 0 16px 38px rgba(61,25,33,.24);
      font-size: 22px;
      font-weight: 950;
    }

    .play-core:active { transform: translateX(-50%) scale(.96); }

    .orbit-item {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      transform:
        translate(-50%, -50%)
        rotate(calc(var(--orbit-spin) + var(--angle)))
        translateX(var(--radius))
        rotate(calc(-1 * (var(--orbit-spin) + var(--angle))));
      will-change: transform;
    }

    .track-node,
    .link-node,
    .collection-node {
      border: 1px solid rgba(255,255,255,.7);
      -webkit-backdrop-filter: blur(16px) saturate(1.24);
      backdrop-filter: blur(16px) saturate(1.24);
      box-shadow: inset 0 1px rgba(255,255,255,.76), 0 12px 30px rgba(54,22,30,.16);
      transition: scale .24s var(--ease), background .24s var(--ease), box-shadow .24s var(--ease);
    }

    .track-node {
      --radius: 40%;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.32);
      font-size: 12px;
      font-weight: 950;
    }

    .track-node[aria-current="true"] {
      scale: 1.2;
      background: linear-gradient(180deg, #fff, #ffd4e1 52%, #f79ab8);
      border-color: rgba(255,255,255,.96);
      box-shadow: inset 0 1px rgba(255,255,255,.9), 0 14px 36px rgba(255,79,148,.30);
    }

    .link-node {
      --radius: 46%;
      min-width: 52px;
      height: 52px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .apple { --angle: 18deg; background: linear-gradient(135deg, #ff5d9d, #a974ff 62%, #5dd7ff); }
    .spotify { --angle: 110deg; background: #1ed760; color: #07130b; }
    .youtube { --angle: 222deg; background: #ff0033; }
    .instagram { --angle: 316deg; background: radial-gradient(circle at 30% 115%, #feda75, #fa7e1e 28%, #d62976 54%, #962fbf 74%, #4f5bd5); }

    .collection-node {
      --radius: 48%;
      width: 60px;
      height: 60px;
      display: none;
      padding: 0;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.28);
    }

    .collection-node.active { display: block; }
    .collection-node img { width: 100%; height: 100%; object-fit: cover; }

    .selection-card {
      position: absolute;
      left: 50%;
      bottom: 2%;
      z-index: 6;
      width: min(74%, 470px);
      transform: translateX(-50%);
      padding: 14px 18px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.34);
      -webkit-backdrop-filter: blur(24px) saturate(1.18);
      backdrop-filter: blur(24px) saturate(1.18);
      box-shadow: inset 0 1px rgba(255,255,255,.8), var(--soft-shadow);
      text-align: center;
    }

    .track-count {
      display: block;
      margin-bottom: 5px;
      color: rgba(29,23,25,.5);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .track-title-now {
      display: block;
      font-size: clamp(28px, 5vw, 50px);
      line-height: .92;
      letter-spacing: -.06em;
      font-weight: 950;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side {
      min-width: 0;
      display: grid;
      gap: 14px;
      align-content: center;
    }

    .title-stack,
    .controls,
    .progress-card,
    .track-list,
    .mobile-now {
      border: 1px solid rgba(255,255,255,.66);
      background: rgba(255,255,255,.27);
      -webkit-backdrop-filter: blur(24px) saturate(1.14);
      backdrop-filter: blur(24px) saturate(1.14);
      box-shadow: inset 0 1px rgba(255,255,255,.72), var(--soft-shadow);
    }

    .title-stack {
      padding: 22px;
      border-radius: 34px;
    }

    .title-stack h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 88px);
      line-height: .86;
      letter-spacing: -.08em;
      text-transform: lowercase;
    }

    .title-stack p {
      margin: 12px 0 0;
      color: rgba(29,23,25,.64);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 800;
    }

    .mobile-now { display: none; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      padding: 7px;
      border-radius: 999px;
    }

    .mode-btn,
    .tracks-toggle {
      height: 42px;
      min-width: 88px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(29,23,25,.64);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
      transition: background .24s var(--ease), color .24s var(--ease), transform .24s var(--ease);
    }

    .mode-btn.active,
    .tracks-toggle.active {
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,211,224,.86));
      box-shadow: 0 8px 18px rgba(255,79,148,.14);
    }

    .mode-btn:active,
    .tracks-toggle:active { transform: scale(.97); }

    .track-list {
      display: grid;
      gap: 6px;
      max-height: min(54vh, 560px);
      overflow: auto;
      padding: 10px;
      border-radius: 30px;
      scrollbar-width: none;
    }

    .track-list::-webkit-scrollbar { display: none; }

    .row {
      width: 100%;
      padding: 12px;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: center;
      border: 0;
      border-radius: 18px;
      background: transparent;
      text-align: left;
      transition: background .22s var(--ease), transform .22s var(--ease);
    }

    .row:hover,
    .row.active { background: rgba(255,255,255,.40); transform: translateY(-1px); }

    .row-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.38);
      font-size: 12px;
      font-weight: 950;
    }

    .row-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 880;
      letter-spacing: -.02em;
    }

    .progress-card {
      padding: 10px 13px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
      align-items: center;
      border-radius: 999px;
      color: rgba(29,23,25,.58);
      font-size: 12px;
      font-weight: 850;
    }

    .range { width: 100%; accent-color: var(--hot-pink); }

    .hint {
      min-height: 18px;
      color: rgba(29,23,25,.5);
      text-align: center;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      background: rgba(66,30,42,.10);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      transition: opacity .25s var(--ease);
    }

    .drawer-scrim.open { opacity: 1; pointer-events: auto; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px);
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 999px;
      background: rgba(255,255,255,.46);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: var(--soft-shadow);
      color: rgba(29,23,25,.72);
      font-size: 13px;
      font-weight: 900;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    html.orbit-dragging .track-node,
    html.orbit-dragging .link-node,
    html.orbit-dragging .collection-node,
    html.orbit-dragging .ring,
    html.orbit-dragging .album-object {
      transition: none !important;
    }

    @media (max-width: 900px) {
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        min-height: 100dvh;
        position: relative;
      }

      .backdrop { inset: -8vh -16vw; }
      .backdrop::before { filter: blur(46px) saturate(1.18); opacity: .38; }

      .app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        gap: 8px;
        overflow: hidden;
        padding:
          max(10px, env(safe-area-inset-top))
          10px
          max(10px, env(safe-area-inset-bottom));
      }

      .topline { min-height: 46px; }
      .wordmark { min-height: 42px; padding: 0 17px; font-size: 11px; letter-spacing: .28em; }
      .mini-now { display: none; }

      .stage-grid {
        width: 100%;
        height: 100%;
        min-height: 0;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: stretch;
      }

      .universe {
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .orbit-shell {
        width: min(calc(100vw - 20px), calc(100dvh - 252px), 540px);
        min-width: 286px;
        max-width: 100%;
      }

      .orbit-shell::before { inset: 2%; filter: blur(24px); opacity: .66; }
      .orbit-shell::after { inset: 8%; }
      .ring { inset: 5%; }

      .album-object { width: 55%; }
      .cover-wrap { border-radius: 27px; box-shadow: inset 0 1px rgba(255,255,255,.86), 0 0 0 7px rgba(255,255,255,.1), var(--shadow); }
      .play-core { width: 60px; height: 60px; bottom: 2%; font-size: 19px; }

      .track-node {
        --radius: 39%;
        width: 38px;
        height: 38px;
        font-size: 11px;
      }

      .track-node[aria-current="true"] { scale: 1.17; }

      .link-node {
        --radius: 44%;
        min-width: 44px;
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 0;
        letter-spacing: 0;
      }

      .link-node::after { font-size: 11px; font-weight: 950; letter-spacing: .06em; }
      .apple::after { content: "AM"; }
      .spotify::after { content: "SP"; }
      .youtube::after { content: "YT"; }
      .instagram::after { content: "IG"; }

      .selection-card { display: none; }

      .side {
        min-height: 0;
        align-content: end;
        gap: 7px;
        z-index: 9;
      }

      .title-stack,
      .hint { display: none; }

      .mobile-now {
        display: grid;
        grid-template-columns: auto minmax(0,1fr);
        gap: 11px;
        align-items: center;
        min-height: 58px;
        padding: 8px 12px;
        border-radius: 22px;
      }

      .mobile-count {
        min-width: 48px;
        color: rgba(29,23,25,.52);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .mobile-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(21px, 6vw, 28px);
        line-height: .92;
        letter-spacing: -.045em;
        font-weight: 950;
      }

      .controls {
        grid-template-columns: 1fr 1fr 84px;
        gap: 6px;
        padding: 6px;
      }

      .mode-btn,
      .tracks-toggle {
        min-width: 0;
        height: 40px;
        padding: 0 8px;
        font-size: 11px;
        letter-spacing: .08em;
      }

      .progress-card {
        min-height: 38px;
        grid-template-columns: 34px 1fr 34px;
        padding: 7px 10px;
        font-size: 10px;
      }

      .track-list {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 14;
        max-height: min(70dvh, 620px);
        padding: 10px;
        border-radius: 28px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(calc(100% + 28px));
        transition: transform .34s var(--ease), opacity .24s var(--ease);
      }

      .track-list.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .row { padding: 12px; }
      .row-title { font-size: 16px; }
      .collection-node { --radius: 45%; width: 48px; height: 48px; }
    }

    @media (max-width: 390px), (max-height: 700px) {
      .app { padding-top: max(8px, env(safe-area-inset-top)); gap: 5px; }
      .topline { min-height: 40px; }
      .wordmark { min-height: 38px; padding: 0 14px; font-size: 10px; }
      .orbit-shell { width: min(calc(100vw - 20px), calc(100dvh - 230px), 460px); min-width: 268px; }
      .album-object { width: 53%; }
      .track-node { width: 35px; height: 35px; }
      .link-node { width: 41px; min-width: 41px; height: 41px; }
      .mobile-now { min-height: 52px; padding: 7px 10px; }
      .mobile-title { font-size: 21px; }
      .controls { padding: 5px; }
      .mode-btn, .tracks-toggle { height: 37px; font-size: 10px; }
      .progress-card { min-height: 34px; padding-block: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
      .album-object, .ring { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="glimmer" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>

  <main class="app">
    <header class="topline">
      <a class="wordmark" href="#" aria-label="Saint Jules home">SAINT JULES</a>
      <div class="mini-now"><span class="mini-dot"></span><span id="miniTitle">Boy Genius</span></div>
    </header>

    <section class="stage-grid" aria-label="Saint Jules album player">
      <div class="universe">
        <div class="orbit-shell" id="orbitShell">
          <div class="ring" aria-hidden="true">
            <span class="ring-line"></span>
            <span class="ring-line"></span>
            <span class="ring-line"></span>
          </div>

          <div id="trackNodes"></div>

          <a class="orbit-item link-node apple" href="https://music.apple.com/us/album/the-proposition/1895704396?i=6764253201" target="_blank" rel="noopener" aria-label="Apple Music"><span>Apple</span></a>
          <a class="orbit-item link-node spotify" href="#" aria-label="Spotify"><span>Spotify</span></a>
          <a class="orbit-item link-node youtube" href="#" aria-label="YouTube"><span>YouTube</span></a>
          <a class="orbit-item link-node instagram" href="#" aria-label="Instagram"><span>Instagram</span></a>
          <button class="orbit-item collection-node" id="collectionNode" type="button" aria-label="Open extra music collection"></button>

          <div class="album-object" id="albumObject">
            <div class="cover-wrap">
              <img src="album-cover.jpeg" alt="Lord Have Mercy, He's A Crash Dummy! album cover" />
            </div>
            <button class="play-core" id="playPause" type="button" aria-label="Play or pause">▶</button>
          </div>

          <div class="selection-card" aria-live="polite">
            <span class="track-count" id="trackCount">01 / 13</span>
            <span class="track-title-now" id="trackTitle">Boy Genius</span>
          </div>
        </div>
      </div>

      <aside class="side">
        <div class="title-stack">
          <h1>lord have mercy.</h1>
          <p>Saint Jules</p>
        </div>

        <div class="mobile-now" aria-live="polite">
          <span class="mobile-count" id="mobileCount">01 / 13</span>
          <span class="mobile-title" id="mobileTitle">Boy Genius</span>
        </div>

        <div class="controls" aria-label="Playback mode">
          <button class="mode-btn active" id="orderBtn" type="button">order</button>
          <button class="mode-btn" id="shuffleBtn" type="button">shuffle</button>
          <button class="tracks-toggle" id="trackToggle" type="button">tracks</button>
        </div>

        <div class="track-list" id="trackList" aria-label="Track list"></div>

        <div class="progress-card">
          <span id="currentTime">0:00</span>
          <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
          <span id="duration">0:00</span>
        </div>
        <div class="hint" id="hint">drag the orbit · flick to spin</div>
      </aside>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    const repo = "SMPchase/Saint-jules-";
    const branch = "main";
    const normalRoot = "Lord Have Mercy, He's A Crash Dummy!";
    const orderRoot = "The Proposition comple";
    const asset = (...parts) => parts.map(part => encodeURIComponent(part)).join("/");

    const tracks = [
      { num: "01", title: "Boy Genius", selectFile: "01 Boy Genius.wav", orderFile: "01 Boy genius interlude full.mp3", lyrics: null },
      { num: "02", title: "Jump!!!", selectFile: "02 Jump!!!.wav", orderFile: "02 Jump!!!.wav", lyrics: null },
      { num: "03", title: "Come to Life", selectFile: "03 Come to Life.wav", orderFile: "03 Come to Life.wav", lyrics: null },
      { num: "04", title: "The Proposition", selectFile: "04 The Proposition.wav", orderFile: "04 The Proposition.wav", lyrics: null },
      { num: "05", title: "Rude", selectFile: "05 Rude.wav", orderFile: "05 Rude.wav", lyrics: null },
      { num: "06", title: "PISA", selectFile: "06 PISA.wav", orderFile: "06 Pisa Interlude full.wav", lyrics: null },
      { num: "07", title: "Apple Pie", selectFile: "07 Apple Pie.wav", orderFile: "07 Apple Pie.wav", lyrics: null },
      { num: "08", title: "I Know", selectFile: "08 I Know..wav", orderFile: "08 I Know..wav", lyrics: null },
      { num: "09", title: "Felt It? My Darling", selectFile: "09 Felt It?:My Darling .wav", orderFile: "09 Felt It?:My Darling .wav", lyrics: null },
      { num: "10", title: "Crash Dummy", selectFile: "10 Crash Dummy.wav", orderFile: "10 Crash Dummy interlude full.wav", lyrics: null },
      { num: "11", title: "Mr. Please", selectFile: "11 Mr.Please.wav", orderFile: "11 Mr.Please.wav", lyrics: null },
      { num: "12", title: "WHO KNEW", selectFile: "12 WHO KNEW.wav", orderFile: "12 WHO KNEW.wav", lyrics: null },
      { num: "13", title: "Sky Is Falling", selectFile: "13 Sky Is Falling.wav", orderFile: "13 Sky Is Falling.wav", lyrics: null }
    ].map(track => ({
      ...track,
      selectSrc: asset(normalRoot, track.selectFile),
      orderSrc: asset(orderRoot, track.orderFile)
    }));

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const mod = (value, length) => ((value % length) + length) % length;
    const normalizeAngle = angle => {
      let value = angle % 360;
      if (value > 180) value -= 360;
      if (value < -180) value += 360;
      return value;
    };

    const els = {
      root: document.documentElement,
      orbitShell: $("#orbitShell"),
      trackNodes: $("#trackNodes"),
      trackList: $("#trackList"),
      playPause: $("#playPause"),
      orderBtn: $("#orderBtn"),
      shuffleBtn: $("#shuffleBtn"),
      trackToggle: $("#trackToggle"),
      drawerScrim: $("#drawerScrim"),
      audio: $("#audio"),
      currentTime: $("#currentTime"),
      duration: $("#duration"),
      seek: $("#seek"),
      trackCount: $("#trackCount"),
      trackTitle: $("#trackTitle"),
      mobileCount: $("#mobileCount"),
      mobileTitle: $("#mobileTitle"),
      miniTitle: $("#miniTitle"),
      toast: $("#toast"),
      collectionNode: $("#collectionNode")
    };

    const segment = 360 / tracks.length;
    const state = {
      current: 0,
      mode: "order",
      spin: 0,
      dragging: false,
      moved: false,
      pointerId: null,
      lastAngle: 0,
      lastTime: 0,
      velocity: 0,
      inertiaFrame: 0,
      extraCollections: []
    };

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = String(Math.floor(seconds % 60)).padStart(2, "0");
      return `${min}:${sec}`;
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1700);
    }

    function setMode(mode) {
      state.mode = mode;
      els.orderBtn.classList.toggle("active", mode === "order");
      els.shuffleBtn.classList.toggle("active", mode === "shuffle");
    }

    function toggleTracks(force) {
      const open = typeof force === "boolean" ? force : !els.trackList.classList.contains("open");
      els.trackList.classList.toggle("open", open);
      els.drawerScrim.classList.toggle("open", open);
      els.trackToggle.classList.toggle("active", open);
    }

    function srcFor(track, mode = state.mode) {
      return mode === "order" ? track.orderSrc : track.selectSrc;
    }

    function angleFromEvent(event) {
      const rect = els.orbitShell.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      return Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI;
    }

    function setSpin(value) {
      state.spin = value;
      els.root.style.setProperty("--orbit-spin", `${value}deg`);
    }

    function indexFromSpin(spin = state.spin) {
      return mod(Math.round(-spin / segment), tracks.length);
    }

    function setCurrentUI(index) {
      state.current = mod(index, tracks.length);
      const track = tracks[state.current];
      const count = `${track.num} / ${String(tracks.length).padStart(2, "0")}`;
      els.trackCount.textContent = count;
      els.mobileCount.textContent = count;
      els.trackTitle.textContent = track.title;
      els.mobileTitle.textContent = track.title;
      els.miniTitle.textContent = track.title;
      $$(".track-node").forEach((node, nodeIndex) => node.setAttribute("aria-current", String(nodeIndex === state.current)));
      $$(".row").forEach((row, rowIndex) => row.classList.toggle("active", rowIndex === state.current));
    }

    function renderNodes() {
      els.trackNodes.innerHTML = tracks.map((track, index) => {
        const angle = index * segment - 90;
        return `<button class="orbit-item track-node" type="button" style="--angle:${angle}deg" data-index="${index}" aria-label="${track.num} ${track.title}">${track.num}</button>`;
      }).join("");

      $$(".track-node", els.trackNodes).forEach(node => {
        node.addEventListener("click", event => {
          event.stopPropagation();
          const index = Number(node.dataset.index);
          const autoplay = !els.audio.paused && Boolean(els.audio.src);
          selectTrack(index, autoplay, "shuffle", true);
        });
      });
    }

    function renderTrackList() {
      els.trackList.innerHTML = tracks.map((track, index) => `
        <button class="row" type="button" data-index="${index}" aria-label="${track.num} ${track.title}">
          <span class="row-num">${track.num}</span>
          <span class="row-title">${track.title}</span>
        </button>
      `).join("");

      $$(".row", els.trackList).forEach(row => {
        row.addEventListener("click", () => {
          const autoplay = !els.audio.paused && Boolean(els.audio.src);
          selectTrack(Number(row.dataset.index), autoplay, "shuffle", true);
          toggleTracks(false);
        });
      });
    }

    function snapSpinToIndex(index, animate = true) {
      cancelAnimationFrame(state.inertiaFrame);
      const target = -mod(index, tracks.length) * segment;
      if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setSpin(target);
        return;
      }

      const start = state.spin;
      const delta = normalizeAngle(target - start);
      const duration = 320;
      const started = performance.now();

      const tick = now => {
        const progress = Math.min(1, (now - started) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        setSpin(start + delta * eased);
        setCurrentUI(indexFromSpin());
        if (progress < 1) state.inertiaFrame = requestAnimationFrame(tick);
        else setSpin(target);
      };

      state.inertiaFrame = requestAnimationFrame(tick);
    }

    function selectTrack(index, autoplay = false, mode = state.mode, animateOrbit = true) {
      const nextIndex = mod(index, tracks.length);
      setMode(mode);
      setCurrentUI(nextIndex);
      snapSpinToIndex(nextIndex, animateOrbit);
      const track = tracks[nextIndex];
      const nextSrc = srcFor(track, mode);
      if (!els.audio.src.endsWith(nextSrc)) els.audio.src = nextSrc;
      if (autoplay) play();
    }

    async function play() {
      try {
        await els.audio.play();
        updatePlayIcon();
      } catch {
        toast("tap once more");
      }
    }

    function pause() {
      els.audio.pause();
      updatePlayIcon();
    }

    function updatePlayIcon() {
      els.playPause.textContent = els.audio.paused ? "▶" : "Ⅱ";
    }

    function shuffle() {
      let next = Math.floor(Math.random() * tracks.length);
      if (tracks.length > 1 && next === state.current) next = (next + 1) % tracks.length;
      selectTrack(next, true, "shuffle", true);
    }

    function commitOrbitSelection() {
      const nextIndex = indexFromSpin();
      const autoplay = !els.audio.paused && Boolean(els.audio.src);
      selectTrack(nextIndex, autoplay, state.mode === "order" ? "order" : "shuffle", true);
    }

    function startInertia() {
      cancelAnimationFrame(state.inertiaFrame);
      let velocity = Math.max(-18, Math.min(18, state.velocity));

      const tick = () => {
        velocity *= .935;
        setSpin(state.spin + velocity);
        setCurrentUI(indexFromSpin());
        if (Math.abs(velocity) > .16) {
          state.inertiaFrame = requestAnimationFrame(tick);
        } else {
          commitOrbitSelection();
        }
      };

      if (Math.abs(velocity) > .6) state.inertiaFrame = requestAnimationFrame(tick);
      else commitOrbitSelection();
    }

    els.orbitShell.addEventListener("pointerdown", event => {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.target.closest("a, button, input")) return;

      cancelAnimationFrame(state.inertiaFrame);
      state.dragging = true;
      state.moved = false;
      state.pointerId = event.pointerId;
      state.lastAngle = angleFromEvent(event);
      state.lastTime = performance.now();
      state.velocity = 0;
      els.root.classList.add("orbit-dragging");
      els.orbitShell.setPointerCapture(event.pointerId);
      enableMotion();
    });

    els.orbitShell.addEventListener("pointermove", event => {
      const rect = els.orbitShell.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width - .5;
      const y = (event.clientY - rect.top) / rect.height - .5;
      els.root.style.setProperty("--mx", `${x * 34}px`);
      els.root.style.setProperty("--my", `${y * 28}px`);

      if (!state.dragging || event.pointerId !== state.pointerId) {
        els.root.style.setProperty("--tilt-y", `${x * 10}deg`);
        els.root.style.setProperty("--tilt-x", `${y * -8}deg`);
        return;
      }

      event.preventDefault();
      const now = performance.now();
      const angle = angleFromEvent(event);
      const delta = normalizeAngle(angle - state.lastAngle);
      const elapsed = Math.max(8, now - state.lastTime);

      if (Math.abs(delta) > .01) {
        state.moved = true;
        setSpin(state.spin + delta);
        state.velocity = state.velocity * .55 + (delta / elapsed) * 16.67 * .45;
        setCurrentUI(indexFromSpin());
      }

      state.lastAngle = angle;
      state.lastTime = now;
    }, { passive: false });

    function endOrbitDrag(event) {
      if (!state.dragging || event.pointerId !== state.pointerId) return;
      state.dragging = false;
      state.pointerId = null;
      els.root.classList.remove("orbit-dragging");
      try { els.orbitShell.releasePointerCapture(event.pointerId); } catch {}
      if (state.moved) startInertia();
      else snapSpinToIndex(state.current, true);
    }

    els.orbitShell.addEventListener("pointerup", endOrbitDrag);
    els.orbitShell.addEventListener("pointercancel", endOrbitDrag);
    els.orbitShell.addEventListener("lostpointercapture", event => {
      if (state.dragging && event.pointerId === state.pointerId) endOrbitDrag(event);
    });

    els.orbitShell.addEventListener("wheel", event => {
      if (Math.abs(event.deltaY) < 4 && Math.abs(event.deltaX) < 4) return;
      event.preventDefault();
      const direction = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
        ? Math.sign(event.deltaY)
        : Math.sign(event.deltaX);
      const next = mod(state.current + direction, tracks.length);
      selectTrack(next, !els.audio.paused && Boolean(els.audio.src), state.mode, true);
    }, { passive: false });

    els.playPause.addEventListener("click", event => {
      event.stopPropagation();
      if (!els.audio.src) selectTrack(state.current, false, state.mode, false);
      if (els.audio.paused) play();
      else pause();
      enableMotion();
    });

    els.orderBtn.addEventListener("click", () => {
      selectTrack(0, true, "order", true);
      enableMotion();
    });

    els.shuffleBtn.addEventListener("click", () => {
      setMode("shuffle");
      shuffle();
      enableMotion();
    });

    els.trackToggle.addEventListener("click", () => toggleTracks());
    els.drawerScrim.addEventListener("click", () => toggleTracks(false));

    els.audio.addEventListener("play", updatePlayIcon);
    els.audio.addEventListener("pause", updatePlayIcon);
    els.audio.addEventListener("ended", () => {
      if (state.mode === "order") selectTrack(state.current + 1, true, "order", true);
      else shuffle();
    });

    els.audio.addEventListener("loadedmetadata", () => {
      els.duration.textContent = formatTime(els.audio.duration);
    });

    els.audio.addEventListener("timeupdate", () => {
      els.currentTime.textContent = formatTime(els.audio.currentTime);
      if (Number.isFinite(els.audio.duration) && els.audio.duration > 0) {
        els.seek.value = String(Math.round((els.audio.currentTime / els.audio.duration) * 1000));
      }
    });

    els.seek.addEventListener("input", () => {
      if (Number.isFinite(els.audio.duration)) {
        els.audio.currentTime = (Number(els.seek.value) / 1000) * els.audio.duration;
      }
    });

    document.addEventListener("pointermove", event => {
      if (window.matchMedia("(max-width: 900px)").matches || state.dragging) return;
      const x = (event.clientX / window.innerWidth - .5) * 2;
      const y = (event.clientY / window.innerHeight - .5) * 2;
      els.root.style.setProperty("--mx", `${x * 24}px`);
      els.root.style.setProperty("--my", `${y * 20}px`);
      els.root.style.setProperty("--tilt-y", `${x * 6}deg`);
      els.root.style.setProperty("--tilt-x", `${y * -5}deg`);
    }, { passive: true });

    async function enableMotion() {
      const Motion = window.DeviceOrientationEvent;
      if (!Motion || enableMotion.done) return;

      try {
        if (typeof Motion.requestPermission === "function") {
          const permission = await Motion.requestPermission();
          if (permission !== "granted") return;
        }
      } catch {
        return;
      }

      enableMotion.done = true;
      window.addEventListener("deviceorientation", event => {
        if (state.dragging) return;
        const gamma = Math.max(-24, Math.min(24, event.gamma || 0));
        const beta = Math.max(-24, Math.min(24, (event.beta || 0) - 40));
        els.root.style.setProperty("--tilt-y", `${gamma * .34}deg`);
        els.root.style.setProperty("--tilt-x", `${beta * -.22}deg`);
        els.root.style.setProperty("--mx", `${gamma * .65}px`);
        els.root.style.setProperty("--my", `${beta * .5}px`);
      }, true);
    }

    async function discoverFolder(folderName) {
      const localManifest = `${encodeURIComponent(folderName)}/manifest.json`;
      try {
        const manifest = await fetch(localManifest, { cache: "no-store" });
        if (manifest.ok) return await manifest.json();
      } catch {}

      try {
        const api = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(folderName)}?ref=${branch}`;
        const response = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) return null;
        const entries = await response.json();
        const audioFiles = entries.filter(file => /\.(mp3|wav|m4a|aac|ogg)$/i.test(file.name));
        const image = entries.find(file => /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name));
        if (!audioFiles.length) return null;
        return {
          title: folderName,
          cover: image?.download_url || "album-cover.jpeg",
          tracks: audioFiles
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
            .map((file, index) => ({
              num: String(index + 1).padStart(2, "0"),
              title: file.name.replace(/\.(mp3|wav|m4a|aac|ogg)$/i, "").replace(/^\d+\s*/, ""),
              src: file.download_url
            }))
        };
      } catch {
        return null;
      }
    }

    async function bootExtraCollections() {
      const jasper = await discoverFolder("Jasper");
      if (!jasper) return;
      state.extraCollections.push(jasper);
      els.collectionNode.innerHTML = `<img src="${jasper.cover}" alt="${jasper.title}">`;
      els.collectionNode.classList.add("active");
      els.collectionNode.style.setProperty("--angle", "72deg");
      els.collectionNode.addEventListener("click", event => {
        event.stopPropagation();
        toast(jasper.title);
      });
    }

    renderNodes();
    renderTrackList();
    setCurrentUI(0);
    setSpin(0);
    selectTrack(0, false, "order", false);
    bootExtraCollections();
  </script>
</body>
</html>
