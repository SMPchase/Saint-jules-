<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efb7ca" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="refresh" content="0; url=https://studio.saintjules.org/studio/hotdogs-holler" />
  <title>Hotdogs Holler Questions · Saint Jules</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color: #21181c;
      background: #efb7ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 49, 94, .34), transparent 31%),
        radial-gradient(circle at 84% 20%, rgba(169, 217, 232, .68), transparent 34%),
        radial-gradient(circle at 56% 92%, rgba(244, 223, 189, .82), transparent 42%),
        linear-gradient(145deg, #f5aec5 0%, #f3c3d2 44%, #dbeef1 100%);
    }

    main {
      width: min(100%, 470px);
      padding: clamp(28px, 7vw, 44px);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 34px;
      background: rgba(255, 255, 255, .42);
      box-shadow: inset 0 1px rgba(255, 255, 255, .9), 0 24px 70px rgba(85, 35, 56, .22);
      backdrop-filter: blur(24px) saturate(1.12);
      -webkit-backdrop-filter: blur(24px) saturate(1.12);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(35px, 10vw, 54px);
      line-height: .95;
      letter-spacing: -.055em;
    }

    p {
      margin: 20px auto 26px;
      max-width: 32ch;
      color: rgba(33, 24, 28, .68);
      font-size: 15px;
      line-height: 1.55;
    }

    a {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ff4f87, #d92c67 58%, #8d1847);
      box-shadow: inset 0 1px rgba(255, 255, 255, .56), 0 14px 30px rgba(198, 34, 91, .27);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:focus-visible {
      outline: 3px solid #21181c;
      outline-offset: 4px;
    }

    .privacy {
      margin: 19px 0 0;
      font-size: 12px;
    }
  </style>
  <script>
    window.location.replace("https://studio.saintjules.org/studio/hotdogs-holler");
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">Saint Jules · Private Studio</p>
    <h1>Hotdogs<br />Holler</h1>
    <p>Opening your private field notebook. Sign in with an approved Studio account to continue.</p>
    <a href="https://studio.saintjules.org/studio/hotdogs-holler">Open private questions</a>
    <p class="privacy">Interview records and voice notes stay in the protected Studio.</p>
  </main>
</body>
</html>
